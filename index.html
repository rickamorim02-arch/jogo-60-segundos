<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><title>Arco e Flecha Viking</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#07111a;color:#fff;font-family:system-ui,sans-serif}.game{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:linear-gradient(#69b8d8 0 28%,#a9c8c3 28% 31%,#486c43 31% 100%)}.sun{position:absolute;right:8%;top:10%;width:52px;height:52px;border-radius:50%;background:#ffe4a1;box-shadow:0 0 35px #ffe7a8}.cloud{position:absolute;color:#fff9;font-size:38px;animation:cloud 18s linear infinite}@keyframes cloud{from{transform:translateX(-120px)}to{transform:translateX(600px)}}.mountains{position:absolute;top:18%;width:100%;height:20%;background:linear-gradient(#667c70,#3c5841);clip-path:polygon(0 72%,12% 30%,24% 70%,39% 10%,54% 72%,72% 25%,87% 68%,100% 20%,100% 100%,0 100%)}.forest{position:absolute;top:30%;width:100%;height:12%;background:repeating-linear-gradient(70deg,#173c27 0 12px,#245235 12px 24px);clip-path:polygon(0 45%,5% 10%,10% 50%,15% 0,20% 48%,25% 8%,30% 55%,36% 0,42% 52%,48% 5%,55% 50%,62% 0,69% 55%,76% 5%,84% 50%,91% 0,100% 48%,100% 100%,0 100%)}.ground{position:absolute;top:38%;bottom:0;width:100%;background:linear-gradient(#71964b,#3c672f 48%,#254823)}.lane{position:absolute;z-index:2;left:44%;top:39%;width:12%;height:45%;background:linear-gradient(#8d7d58aa,#65573799);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}.score{position:absolute;z-index:50;top:max(8px,env(safe-area-inset-top));left:7px;right:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;pointer-events:none}.pill{background:#07131be8;border:1px solid #ffffff3d;border-radius:12px;padding:5px 2px;text-align:center;font-size:8px;font-weight:850;box-shadow:0 4px 12px #0005}.pill b{display:block;font-size:18px}.wind{position:absolute;z-index:45;top:72px;left:50%;transform:translateX(-50%);min-width:215px;text-align:center;background:#102432dc;border:1px solid #ffffff40;border-radius:16px;padding:7px 12px;font-weight:900;font-size:12px;box-shadow:0 5px 14px #0005}.wind span{font-size:19px}.wind small{display:block;color:#cfe7f3;font-size:9px;margin-top:2px}.target{position:absolute;z-index:8;left:50%;top:24%;width:82px;height:82px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#f4d42e 0 11%,#d93434 11% 25%,#2e79bb 25% 40%,#161616 40% 55%,#eee 55% 70%,#a77742 70%);border:4px solid #604323;box-shadow:0 4px 10px #0009}.stand{position:absolute;z-index:6;left:50%;top:27%;width:6px;height:17%;background:#64431f;transform:translateX(-50%);box-shadow:15px 45px 0 -1px #64431f,-15px 45px 0 -1px #64431f}.viking{position:absolute;z-index:14;left:17%;top:70%;width:115px;height:174px;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 6px #0008);pointer-events:none}.head{position:absolute;left:37px;top:21px;width:50px;height:57px;border-radius:45%;background:#dca574;border:3px solid #5a3426}.hair{position:absolute;left:29px;top:40px;width:67px;height:50px;border-radius:15px 15px 28px 28px;background:#6e3b20}.helmet{position:absolute;left:29px;top:8px;width:67px;height:36px;border-radius:38px 38px 8px 8px;background:linear-gradient(135deg,#b7bec2,#58636b 55%,#333b40);border:3px solid #252a2d}.helmet:after{content:'';position:absolute;left:29px;top:-9px;width:7px;height:49px;background:#c4c9cc;box-shadow:1px 0 2px #222}.face{position:absolute;left:42px;top:38px;width:40px;height:31px;border-radius:40%;background:#e1aa78;z-index:2}.beard{position:absolute;left:39px;top:58px;width:47px;height:51px;background:linear-gradient(#8e4b27,#613017);clip-path:polygon(0 0,100% 0,82% 70%,50% 100%,17% 70%);z-index:3}.body{position:absolute;left:24px;top:94px;width:75px;height:62px;border-radius:17px 17px 8px 8px;background:linear-gradient(90deg,#3b2a23,#76523a,#3b2a23);border:3px solid #2c211d}.body:after{content:'';position:absolute;left:0;right:0;top:28px;height:10px;background:#25201c;border-block:2px solid #aa8248}.leg{position:absolute;top:148px;width:20px;height:35px;background:#292a28;border-radius:7px}.l1{left:34px;transform:rotate(5deg)}.l2{left:72px;transform:rotate(-6deg)}.arm{position:absolute;left:80px;top:95px;width:50px;height:17px;border-radius:12px;background:#dca574;transform:rotate(-18deg);transform-origin:left}.bow{position:absolute;z-index:16;left:44%;top:70%;font-size:78px;transform:translate(-50%,-50%) rotate(-35deg);filter:drop-shadow(0 5px 4px #0008);pointer-events:none;will-change:transform}.aim{position:absolute;z-index:24;width:34px;height:34px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);display:none;pointer-events:none;box-shadow:0 0 12px #fff}.aim:before,.aim:after{content:'';position:absolute;background:#fff}.aim:before{width:48px;height:1px;left:-9px;top:14px}.aim:after{height:48px;width:1px;left:14px;top:-9px}.hint{position:absolute;z-index:30;bottom:4%;width:100%;text-align:center;font-size:12px;font-weight:900;text-shadow:0 2px 5px #000}.msg{position:absolute;z-index:55;top:13%;width:100%;text-align:center;font-size:32px;font-weight:950;text-shadow:0 4px 10px #000;pointer-events:none}canvas{position:absolute;z-index:20;inset:0;width:100%;height:100%;touch-action:none}.overlay{position:absolute;z-index:70;inset:0;background:#06120deb;display:grid;place-items:center;padding:24px}.card{text-align:center;background:linear-gradient(#263e39,#0b1c18);border:1px solid #ffffff35;border-radius:26px;padding:27px;width:100%;max-width:380px;box-shadow:0 20px 60px #000}.card h1{font-size:32px;margin:5px}.card p{color:#d1dfd3;line-height:1.45}.main{border:0;border-radius:17px;padding:17px;width:100%;font-size:19px;font-weight:950;background:#e8bd43;color:#172315}.hidden{display:none}</style></head><body><main class="game" id="game"><div class="sun"></div><div class="cloud">☁️</div><div class="mountains"></div><div class="forest"></div><div class="ground"></div><div class="lane"></div><div class="score"><div class="pill">⏱ TEMPO<b id="time">60</b></div><div class="pill">🎯 PONTOS<b id="points">0</b></div><div class="pill">🔥 SEQUÊNCIA<b id="streak">0</b></div><div class="pill">🏆 RECORDE<b id="best">0</b></div></div><div class="wind">VENTO <span id="windHArrow">→</span> <b id="windHValue">0</b>　<span id="windVArrow">↑</span> <b id="windVValue">0</b><small>horizontal　•　vertical</small></div><div class="stand"></div><div class="target" id="target"></div><div class="viking"><div class="hair"></div><div class="head"></div><div class="helmet"></div><div class="face"></div><div class="beard"></div><div class="body"></div><div class="arm"></div><div class="leg l1"></div><div class="leg l2"></div></div><div class="bow" id="bow">🏹</div><canvas id="canvas"></canvas><div class="aim" id="aim"></div><div class="msg" id="msg"></div><div class="hint">☝️ Mire • pare o dedo • compense o vento ↔ ↕</div><div class="overlay" id="start"><div class="card"><div style="font-size:68px">🛡️ 🏹　　🎯</div><h1>ARCO E FLECHA VIKING</h1><p>Agora o vento atua em <b>duas direções</b>: esquerda/direita e para cima/baixo. Observe os dois indicadores e compense a mira.</p><button class="main" onclick="startGame()">COMEÇAR</button></div></div></main><script>const $=x=>document.getElementById(x),game=$('game'),cv=$('canvas'),ctx=cv.getContext('2d'),aim=$('aim'),bow=$('bow');let points=0,streak=0,time=60,timer,busy=false,drag=false,startP,pending,autoTimer,rafAim=0,stuck=[],windH=0,windV=0,best=+(localStorage.getItem('archery-best')||0);$('best').textContent=best;function resize(){let r=game.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);drawStuck()}resize();addEventListener('resize',resize,{passive:true});function pnt(e){let r=game.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function newWind(){windH=Math.round((Math.random()*2-1)*6);windV=Math.round((Math.random()*2-1)*4);$('windHValue').textContent=Math.abs(windH)+' km/h';$('windVValue').textContent=Math.abs(windV)+' km/h';$('windHArrow').textContent=windH<0?'←':windH>0?'→':'•';$('windVArrow').textContent=windV<0?'↑':windV>0?'↓':'•'}function startGame(){$('start').classList.add('hidden');points=streak=0;time=60;busy=false;stuck=[];newWind();drawStuck();upd();clearInterval(timer);timer=setInterval(()=>{time--;$('time').textContent=time;if(time<=0)finish()},1000)}function finish(){clearInterval(timer);clearTimeout(autoTimer);busy=true;drag=false;$('msg').textContent='TEMPO! 🏹';setTimeout(()=>{$('start').classList.remove('hidden');$('start').querySelector('p').innerHTML='Você fez <b>'+points+' pontos</b>. Agora o vento também oscila verticalmente.';$('start').querySelector('button').textContent='JOGAR NOVAMENTE';$('msg').textContent=''},650)}function upd(){$('points').textContent=points;$('streak').textContent=streak;$('best').textContent=best;$('time').textContent=time}cv.addEventListener('pointerdown',e=>{if(busy||time<=0)return;let p=pnt(e);if(p.y<game.clientHeight*.43)return;drag=true;startP=p;pending=p;cv.setPointerCapture(e.pointerId);aim.style.display='block';scheduleAim();arm()});cv.addEventListener('pointermove',e=>{if(!drag)return;pending=pnt(e);scheduleAim();arm()});cv.addEventListener('pointerup',()=>{if(drag){clearTimeout(autoTimer);release()}});cv.addEventListener('pointercancel',()=>{clearTimeout(autoTimer);drag=false;aim.style.display='none'});function arm(){clearTimeout(autoTimer);autoTimer=setTimeout(()=>{if(drag)release()},210)}function scheduleAim(){if(rafAim)return;rafAim=requestAnimationFrame(()=>{rafAim=0;if(!drag)return;let dx=pending.x-startP.x,dy=pending.y-startP.y,tx=game.clientWidth*.5+dx*.62,ty=game.clientHeight*.24+dy*.62;tx=Math.max(20,Math.min(game.clientWidth-20,tx));ty=Math.max(game.clientHeight*.12,Math.min(game.clientHeight*.43,ty));aim.style.left=tx+'px';aim.style.top=ty+'px';let ang=Math.atan2(ty-game.clientHeight*.70,tx-game.clientWidth*.44)*180/Math.PI;bow.style.transform='translate(-50%,-50%) rotate('+(ang+5)+'deg)'})}function release(){if(!drag||busy)return;drag=false;busy=true;clearTimeout(autoTimer);let ar=aim.getBoundingClientRect(),gr=game.getBoundingClientRect(),tx=ar.left-gr.left+ar.width/2,ty=ar.top-gr.top+ar.height/2;aim.style.display='none';fire(tx,ty)}function arrow(x,y,ang,s=1){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(s,s);ctx.strokeStyle='#3a2617';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-28,0);ctx.lineTo(19,0);ctx.stroke();ctx.fillStyle='#d8dde0';ctx.beginPath();ctx.moveTo(27,0);ctx.lineTo(16,-5);ctx.lineTo(16,5);ctx.closePath();ctx.fill();ctx.fillStyle='#b42f2f';ctx.beginPath();ctx.moveTo(-28,0);ctx.lineTo(-39,-7);ctx.lineTo(-35,0);ctx.lineTo(-39,7);ctx.closePath();ctx.fill();ctx.restore()}function drawStuck(){ctx.clearRect(0,0,game.clientWidth,game.clientHeight);for(let a of stuck){ctx.save();ctx.beginPath();ctx.arc(a.x,a.y,3.6,0,Math.PI*2);ctx.fillStyle='#ff3b30';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#fff';ctx.stroke();ctx.beginPath();ctx.arc(a.x,a.y,1.1,0,Math.PI*2);ctx.fillStyle='#2b0b08';ctx.fill();ctx.restore()}}function fire(tx,ty){let sx=game.clientWidth*.44,sy=game.clientHeight*.67,start=performance.now(),duration=620,lastX=sx,lastY=sy,ang=0,hShift=windH*3.2,vShift=windV*3.0;function frame(now){let t=Math.min(1,(now-start)/duration),e=1-Math.pow(1-t,2.7),x=sx+(tx-sx)*e+hShift*t*t,y=sy+(ty-sy)*e-48*Math.sin(Math.PI*t)+vShift*t*t;ang=Math.atan2(y-lastY,x-lastX);lastX=x;lastY=y;drawStuck();arrow(x,y,ang,1-t*.45);if(t<1)requestAnimationFrame(frame);else hit(x,y,ang)}requestAnimationFrame(frame)}function hit(x,y,ang){let tr=$('target').getBoundingClientRect(),gr=game.getBoundingClientRect(),cx=tr.left-gr.left+tr.width/2,cy=tr.top-gr.top+tr.height/2,r=tr.width/2,d=Math.hypot(x-cx,y-cy),earned=d<r*.12?10:d<r*.25?8:d<r*.4?6:d<r*.55?4:d<r*.72?2:0;if(earned){stuck.push({x,y});if(stuck.length>20)stuck.shift();points+=earned;streak++;$('msg').textContent=earned===10?'🎯 NA MOSCA! +10':'+'+earned+' PONTOS';if(navigator.vibrate)navigator.vibrate(earned===10?[20,15,20]:14)}else{streak=0;$('msg').textContent='ERROU!'}if(points>best){best=points;localStorage.setItem('archery-best',best)}drawStuck();upd();setTimeout(()=>{$('msg').textContent='';newWind();busy=false},500)}</script></body></html>
