<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><title>Arco e Flecha</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#07140d;color:#fff;font-family:system-ui,sans-serif}.game{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:linear-gradient(#62b8df 0 37%,#6a9e43 37%)}.mountains{position:absolute;top:22%;width:100%;height:25%;background:#436b45;clip-path:polygon(0 70%,12% 25%,24% 68%,39% 15%,55% 70%,72% 30%,87% 65%,100% 20%,100% 100%,0 100%)}.ground{position:absolute;top:39%;bottom:0;width:100%;background:linear-gradient(#719f45,#345b2b)}.score{position:absolute;z-index:40;top:max(10px,env(safe-area-inset-top));left:8px;right:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;pointer-events:none}.pill{background:#0a1d11e8;border:1px solid #ffffff40;border-radius:13px;padding:6px 2px;text-align:center;font-size:9px;font-weight:850}.pill b{display:block;font-size:20px}.target{position:absolute;z-index:8;left:50%;top:33%;width:190px;height:190px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#f3cf22 0 11%,#e83232 11% 24%,#2684d5 24% 39%,#111 39% 54%,#eee 54% 70%,#b7864e 70%);border:7px solid #79512d;box-shadow:0 8px 18px #0008}.stand{position:absolute;z-index:6;left:50%;top:42%;width:12px;height:27%;background:#704822;transform:translateX(-50%)}.archer{position:absolute;z-index:14;left:20%;top:72%;font-size:94px;filter:drop-shadow(0 7px 5px #0008);pointer-events:none}.bow{position:absolute;z-index:16;left:45%;top:71%;font-size:76px;transform:translate(-50%,-50%) rotate(-35deg);filter:drop-shadow(0 5px 4px #0008);pointer-events:none;transition:transform .08s}.aim{position:absolute;z-index:22;width:48px;height:48px;border:3px solid #fff;border-radius:50%;transform:translate(-50%,-50%);display:none;pointer-events:none;box-shadow:0 0 0 2px #0005,0 0 18px #fff8}.aim:before,.aim:after{content:'';position:absolute;background:#fff}.aim:before{width:66px;height:2px;left:-12px;top:20px}.aim:after{height:66px;width:2px;left:20px;top:-12px}.power{position:absolute;z-index:24;left:12%;right:12%;bottom:7%;height:12px;border-radius:10px;background:#0008;border:1px solid #fff5;overflow:hidden;display:none}.power>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f4d63a,#e33b2f)}.hint{position:absolute;z-index:25;bottom:11%;width:100%;text-align:center;font-size:13px;font-weight:900;text-shadow:0 2px 5px #000}.msg{position:absolute;z-index:45;top:15%;width:100%;text-align:center;font-size:39px;font-weight:950;text-shadow:0 4px 10px #000;pointer-events:none}canvas{position:absolute;z-index:20;inset:0;width:100%;height:100%;touch-action:none}.overlay{position:absolute;z-index:60;inset:0;background:#06120ce8;display:grid;place-items:center;padding:24px}.card{text-align:center;background:linear-gradient(#294431,#0c2114);border:1px solid #ffffff35;border-radius:26px;padding:27px;width:100%;max-width:380px}.card h1{font-size:34px;margin:5px}.card p{color:#d1dfd3;line-height:1.45}.main{border:0;border-radius:17px;padding:17px;width:100%;font-size:19px;font-weight:950;background:#efc638;color:#172315}.hidden{display:none}</style></head><body><main class="game" id="game"><div class="mountains"></div><div class="ground"></div><div class="score"><div class="pill">⏱ TEMPO<b id="time">60</b></div><div class="pill">🎯 PONTOS<b id="points">0</b></div><div class="pill">🔥 SEQUÊNCIA<b id="streak">0</b></div><div class="pill">🏆 RECORDE<b id="best">0</b></div></div><div class="stand"></div><div class="target" id="target"></div><div class="archer">🧍</div><div class="bow" id="bow">🏹</div><canvas id="canvas"></canvas><div class="aim" id="aim"></div><div class="power" id="power"><i id="powerFill"></i></div><div class="msg" id="msg"></div><div class="hint" id="hint">☝️ Toque, deslize para mirar e solte para disparar</div><div class="overlay" id="start"><div class="card"><div style="font-size:72px">🏹🎯</div><h1>ARCO E FLECHA</h1><p>Toque na parte inferior da tela, <b>deslize o dedo para mirar</b> e solte. A distância do deslize controla a força.</p><button class="main" onclick="startGame()">COMEÇAR</button></div></div></main><script>const $=x=>document.getElementById(x),game=$('game'),cv=$('canvas'),ctx=cv.getContext('2d'),aim=$('aim'),bow=$('bow');let points=0,streak=0,time=60,timer,busy=false,drag=false,startP=null,endP=null,power=0,best=+(localStorage.getItem('archery-best')||0);$('best').textContent=best;function resize(){let r=game.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}resize();addEventListener('resize',resize);function pnt(e){let r=game.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function startGame(){$('start').classList.add('hidden');points=streak=0;time=60;busy=false;upd();clearInterval(timer);timer=setInterval(()=>{time--;$('time').textContent=time;if(time<=0)finish()},1000)}function finish(){clearInterval(timer);busy=true;$('msg').textContent='TEMPO! 🏹';setTimeout(()=>{$('start').classList.remove('hidden');$('start').querySelector('p').innerHTML='Você fez <b>'+points+' pontos</b>. Tente superar seu recorde!';$('start').querySelector('button').textContent='JOGAR NOVAMENTE';$('msg').textContent=''},700)}function upd(){$('points').textContent=points;$('streak').textContent=streak;$('best').textContent=best;$('time').textContent=time}cv.onpointerdown=e=>{if(busy||time<=0)return;let p=pnt(e);if(p.y<game.clientHeight*.48)return;drag=true;startP=p;endP=p;cv.setPointerCapture(e.pointerId);aim.style.display='block';$('power').style.display='block';moveAim(p)};cv.onpointermove=e=>{if(!drag)return;endP=pnt(e);let dx=endP.x-startP.x,dy=endP.y-startP.y,dist=Math.min(220,Math.hypot(dx,dy));power=dist/220;$('powerFill').style.width=(power*100)+'%';let tx=game.clientWidth*.5+dx*1.15,ty=game.clientHeight*.33+dy*1.15;tx=Math.max(35,Math.min(game.clientWidth-35,tx));ty=Math.max(game.clientHeight*.16,Math.min(game.clientHeight*.52,ty));moveAim({x:tx,y:ty});let ang=Math.atan2(ty-game.clientHeight*.71,tx-game.clientWidth*.45)*180/Math.PI;bow.style.transform='translate(-50%,-50%) rotate('+(ang+5)+'deg)'};cv.onpointerup=e=>{if(!drag)return;drag=false;if(power>.12)fire();else resetAim()};cv.onpointercancel=()=>{drag=false;resetAim()};function moveAim(p){aim.style.left=p.x+'px';aim.style.top=p.y+'px'}function resetAim(){aim.style.display='none';$('power').style.display='none';$('powerFill').style.width='0';bow.style.transform='translate(-50%,-50%) rotate(-35deg)';power=0}function fire(){busy=true;let ar=aim.getBoundingClientRect(),gr=game.getBoundingClientRect(),tx=ar.left-gr.left+ar.width/2,ty=ar.top-gr.top+ar.height/2;resetAim();let sx=game.clientWidth*.46,sy=game.clientHeight*.68,duration=520-Math.min(.9,power)*210,start=performance.now();function frame(now){let t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,3),x=sx+(tx-sx)*ease,y=sy+(ty-sy)*ease-55*Math.sin(Math.PI*t)*(1-power),dx=tx-sx,dy=ty-sy,ang=Math.atan2(dy,dx);ctx.clearRect(0,0,cv.width,cv.height);ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.strokeStyle='#4a2b15';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-25,0);ctx.lineTo(19,0);ctx.stroke();ctx.fillStyle='#ddd';ctx.beginPath();ctx.moveTo(25,0);ctx.lineTo(14,-6);ctx.lineTo(14,6);ctx.closePath();ctx.fill();ctx.fillStyle='#d44';ctx.beginPath();ctx.moveTo(-25,0);ctx.lineTo(-36,-8);ctx.lineTo(-32,0);ctx.lineTo(-36,8);ctx.closePath();ctx.fill();ctx.restore();if(t<1)requestAnimationFrame(frame);else hit(tx,ty)}requestAnimationFrame(frame)}function hit(x,y){let tr=$('target').getBoundingClientRect(),gr=game.getBoundingClientRect(),cx=tr.left-gr.left+tr.width/2,cy=tr.top-gr.top+tr.height/2,r=tr.width/2,d=Math.hypot(x-cx,y-cy),earned=d<r*.12?10:d<r*.25?8:d<r*.4?6:d<r*.55?4:d<r*.72?2:0;if(earned){points+=earned;streak++;$('msg').textContent=earned===10?'🎯 NA MOSCA! +10':'+'+earned+' PONTOS';if(navigator.vibrate)navigator.vibrate(earned===10?[25,20,25]:20)}else{streak=0;$('msg').textContent='ERROU!'}if(points>best){best=points;localStorage.setItem('archery-best',best)}upd();setTimeout(()=>{ctx.clearRect(0,0,cv.width,cv.height);$('msg').textContent='';busy=false},600)}</script></body></html>
