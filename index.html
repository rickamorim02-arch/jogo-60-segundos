<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><title>Arco e Flecha Viking</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#07100d;color:#fff;font-family:system-ui,sans-serif}.game{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:#101914 url('cenario-viking.png') center center/cover no-repeat}.shade{position:absolute;inset:0;background:linear-gradient(#0007 0 12%,transparent 25% 72%,#0008 100%);pointer-events:none}.score{position:absolute;z-index:50;top:max(8px,env(safe-area-inset-top));left:7px;right:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.pill{background:#07131be6;border:1px solid #ffffff45;border-radius:12px;padding:5px 2px;text-align:center;font-size:8px;font-weight:850;backdrop-filter:blur(6px);box-shadow:0 4px 12px #0008}.pill b{display:block;font-size:18px}.wind{position:absolute;z-index:45;top:70px;left:50%;transform:translateX(-50%);min-width:205px;text-align:center;background:#0b1821df;border:1px solid #ffffff50;border-radius:16px;padding:7px 12px;font-weight:900;font-size:11px;backdrop-filter:blur(7px);box-shadow:0 5px 15px #0008}.wind span{font-size:21px}.wind small{display:block;color:#d7e9f2;font-size:9px}.target{position:absolute;z-index:12;left:72%;top:31%;width:78px;height:78px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#f4d12a 0 11%,#d92f35 11% 25%,#2776b8 25% 40%,#171717 40% 55%,#eee 55% 70%,#9b6b3e 70%);border:3px solid #5b3a1e;box-shadow:0 4px 12px #000a}.aim{position:absolute;z-index:30;width:34px;height:34px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);display:none;pointer-events:none;box-shadow:0 0 12px #fff}.aim:before,.aim:after{content:'';position:absolute;background:#fff}.aim:before{width:48px;height:1px;left:-9px;top:14px}.aim:after{height:48px;width:1px;left:14px;top:-9px}.msg{position:absolute;z-index:55;top:14%;width:100%;text-align:center;font-size:32px;font-weight:950;text-shadow:0 4px 10px #000;pointer-events:none}.hint{position:absolute;z-index:35;bottom:max(18px,env(safe-area-inset-bottom));left:8%;right:8%;padding:9px;border-radius:13px;text-align:center;font-size:12px;font-weight:900;background:#07120dc2;border:1px solid #ffffff30;backdrop-filter:blur(5px)}canvas{position:absolute;z-index:22;inset:0;width:100%;height:100%;touch-action:none}.overlay{position:absolute;z-index:70;inset:0;background:#06100bd9;display:grid;place-items:center;padding:24px;backdrop-filter:blur(3px)}.card{text-align:center;background:#102018e8;border:1px solid #ffffff38;border-radius:25px;padding:25px;width:100%;max-width:380px;box-shadow:0 20px 60px #000}.card h1{font-size:30px;margin:5px}.card p{color:#dbe4dd;line-height:1.45}.main{border:0;border-radius:16px;padding:16px;width:100%;font-size:18px;font-weight:950;background:#e8bd43;color:#172315}.hidden{display:none}</style></head><body><main class="game" id="game"><div class="shade"></div><div class="score"><div class="pill">⏱ TEMPO<b id="time">60</b></div><div class="pill">🎯 PONTOS<b id="points">0</b></div><div class="pill">🔥 SEQUÊNCIA<b id="streak">0</b></div><div class="pill">🏆 RECORDE<b id="best">0</b></div></div><div class="wind">VENTO <span id="wa">→</span> <b id="wv">0 km/h</b><small id="wd">Direita</small></div><div class="target" id="target"></div><canvas id="canvas"></canvas><div class="aim" id="aim"></div><div class="msg" id="msg"></div><div class="hint">☝️ Deslize para mirar • compense um vento por vez • pare para disparar</div><div class="overlay" id="start"><div class="card"><div style="font-size:62px">🏹🎯</div><h1>ARCO E FLECHA VIKING</h1><p>Agora cada disparo recebe <b>somente uma influência de vento</b>: horizontal <i>ou</i> vertical.</p><button class="main" onclick="startGame()">COMEÇAR</button></div></div></main><script>const $=x=>document.getElementById(x),game=$('game'),cv=$('canvas'),ctx=cv.getContext('2d'),aim=$('aim');let points=0,streak=0,time=60,timer,busy=false,drag=false,startP,pending,autoTimer,raf=0,marks=[],windH=0,windV=0,aimX=0,aimY=0,best=+(localStorage.getItem('archery-best')||0);$('best').textContent=best;function resize(){let r=game.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2.5);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);redraw()}resize();addEventListener('resize',resize,{passive:true});function pt(e){let r=game.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function wind(){windH=0;windV=0;let horizontal=Math.random()<.5,mag=1+Math.floor(Math.random()*6),sign=Math.random()<.5?-1:1;if(horizontal){windH=mag*sign;$('wa').textContent=sign<0?'←':'→';$('wd').textContent=sign<0?'Esquerda':'Direita'}else{windV=mag*sign;$('wa').textContent=sign<0?'↑':'↓';$('wd').textContent=sign<0?'Para cima':'Para baixo'}$('wv').textContent=mag+' km/h'}function upd(){$('points').textContent=points;$('streak').textContent=streak;$('best').textContent=best;$('time').textContent=time}function startGame(){$('start').classList.add('hidden');points=streak=0;time=60;busy=false;marks=[];wind();upd();redraw();clearInterval(timer);timer=setInterval(()=>{time--;$('time').textContent=time;if(time<=0)finish()},1000)}function finish(){clearInterval(timer);clearTimeout(autoTimer);busy=true;drag=false;$('msg').textContent='TEMPO! 🏹';setTimeout(()=>{$('start').classList.remove('hidden');$('start').querySelector('p').innerHTML='Você fez <b>'+points+' pontos</b>. Tente superar seu recorde.';$('start').querySelector('button').textContent='JOGAR NOVAMENTE';$('msg').textContent=''},650)}cv.onpointerdown=e=>{if(busy||time<=0)return;let p=pt(e);if(p.y<game.clientHeight*.42)return;drag=true;startP=p;pending=p;cv.setPointerCapture(e.pointerId);aim.style.display='block';schedule();arm()};cv.onpointermove=e=>{if(!drag)return;pending=pt(e);schedule();arm()};cv.onpointerup=()=>{if(drag){clearTimeout(autoTimer);release()}};cv.onpointercancel=()=>{drag=false;clearTimeout(autoTimer);aim.style.display='none';redraw()};function arm(){clearTimeout(autoTimer);autoTimer=setTimeout(()=>{if(drag)release()},230)}function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;if(!drag)return;let dx=pending.x-startP.x,dy=pending.y-startP.y;aimX=game.clientWidth*.72+dx*.72;aimY=game.clientHeight*.31+dy*.72;aimX=Math.max(18,Math.min(game.clientWidth-18,aimX));aimY=Math.max(game.clientHeight*.13,Math.min(game.clientHeight*.58,aimY));aim.style.left=aimX+'px';aim.style.top=aimY+'px';redraw(true)})}function release(){if(!drag||busy)return;drag=false;busy=true;clearTimeout(autoTimer);let a=aim.getBoundingClientRect(),g=game.getBoundingClientRect(),tx=a.left-g.left+a.width/2,ty=a.top-g.top+a.height/2;aim.style.display='none';fire(tx,ty)}function trajectory(tx,ty,t){let sx=game.clientWidth*.27,sy=game.clientHeight*.62,h=windH*3.1,v=windV*3,e=t*t*(3-2*t);return{x:sx+(tx-sx)*e+h*t*t,y:sy+(ty-sy)*e-45*Math.sin(Math.PI*t)+v*t*t}}function drawPath(tx,ty){ctx.save();ctx.beginPath();for(let i=0;i<=48;i++){let p=trajectory(tx,ty,i/48);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.setLineDash([5,7]);ctx.lineWidth=1.8;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.shadowColor='#fff';ctx.shadowBlur=4;ctx.stroke();ctx.restore()}function arrow(x,y,ang,s=1){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(s,s);ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=3;let wood=ctx.createLinearGradient(0,-2,0,2);wood.addColorStop(0,'#b47a3d');wood.addColorStop(.35,'#70421f');wood.addColorStop(.7,'#3d2110');wood.addColorStop(1,'#9a622f');ctx.fillStyle=wood;ctx.beginPath();ctx.roundRect(-39,-1.8,62,3.6,1.8);ctx.fill();ctx.strokeStyle='#2b170c';ctx.lineWidth=.6;ctx.stroke();ctx.strokeStyle='#d8a83f';ctx.lineWidth=1;for(let q=-27;q<14;q+=13){ctx.beginPath();ctx.moveTo(q,-1.7);ctx.lineTo(q+4,1.7);ctx.stroke()}let gold=ctx.createLinearGradient(20,-6,39,6);gold.addColorStop(0,'#fff0a0');gold.addColorStop(.2,'#d7a52e');gold.addColorStop(.5,'#7c4b10');gold.addColorStop(.75,'#f2ca55');gold.addColorStop(1,'#8c5915');ctx.fillStyle=gold;ctx.beginPath();ctx.moveTo(41,0);ctx.lineTo(25,-6);ctx.lineTo(28,-2.3);ctx.lineTo(21,-3);ctx.lineTo(24,0);ctx.lineTo(21,3);ctx.lineTo(28,2.3);ctx.lineTo(25,6);ctx.closePath();ctx.fill();ctx.strokeStyle='#5b350c';ctx.lineWidth=.8;ctx.stroke();ctx.strokeStyle='#ffe38a';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(28,-3);ctx.lineTo(34,0);ctx.lineTo(28,3);ctx.stroke();ctx.fillStyle='#8f241d';ctx.beginPath();ctx.moveTo(-36,-.8);ctx.quadraticCurveTo(-48,-6,-53,-5);ctx.lineTo(-46,-.6);ctx.lineTo(-54,0);ctx.lineTo(-46,.7);ctx.quadraticCurveTo(-48,6,-53,5);ctx.lineTo(-36,1.5);ctx.closePath();ctx.fill();ctx.fillStyle='#e5d2a7';ctx.beginPath();ctx.moveTo(-37,-.6);ctx.lineTo(-50,-3.4);ctx.lineTo(-45,0);ctx.lineTo(-50,3.4);ctx.lineTo(-37,.8);ctx.closePath();ctx.fill();ctx.strokeStyle='#c79a35';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(-38,-2.5);ctx.lineTo(-38,2.5);ctx.moveTo(-42,-2.8);ctx.lineTo(-42,2.8);ctx.stroke();ctx.restore()}function drawMarks(){for(const m of marks){ctx.beginPath();ctx.arc(m.x,m.y,3.5,0,Math.PI*2);ctx.fillStyle='#ff3b30';ctx.fill();ctx.lineWidth=1.4;ctx.strokeStyle='#fff';ctx.stroke()}}function redraw(path=false){ctx.clearRect(0,0,game.clientWidth,game.clientHeight);drawMarks();if(path&&drag)drawPath(aimX,aimY)}function fire(tx,ty){let start=performance.now(),dur=980,lastAng=0;function frame(now){let t=Math.min(1,(now-start)/dur),p=trajectory(tx,ty,t),delta=.004,a=trajectory(tx,ty,Math.max(0,t-delta)),b=trajectory(tx,ty,Math.min(1,t+delta)),targetAng=Math.atan2(b.y-a.y,b.x-a.x);if(t===0)lastAng=targetAng;let diff=Math.atan2(Math.sin(targetAng-lastAng),Math.cos(targetAng-lastAng));lastAng+=diff*.28;redraw();drawPath(tx,ty);arrow(p.x,p.y,lastAng,.92-t*.28);if(t<1)requestAnimationFrame(frame);else{redraw();hit(p.x,p.y)}}requestAnimationFrame(frame)}function hit(x,y){let tr=$('target').getBoundingClientRect(),gr=game.getBoundingClientRect(),cx=tr.left-gr.left+tr.width/2,cy=tr.top-gr.top+tr.height/2,r=tr.width/2,d=Math.hypot(x-cx,y-cy),earned=d<r*.12?10:d<r*.25?8:d<r*.4?6:d<r*.55?4:d<r*.72?2:0;if(earned){marks.push({x,y});if(marks.length>20)marks.shift();points+=earned;streak++;$('msg').textContent=earned===10?'🎯 NA MOSCA! +10':'+'+earned+' PONTOS';if(navigator.vibrate)navigator.vibrate(earned===10?[20,15,20]:14)}else{streak=0;$('msg').textContent='ERROU!'}if(points>best){best=points;localStorage.setItem('archery-best',best)}redraw();upd();setTimeout(()=>{$('msg').textContent='';wind();busy=false},480)}</script></body></html>
