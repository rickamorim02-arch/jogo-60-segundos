<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><title>Chute a Gol</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none}body{margin:0;background:#020813;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}.game{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:linear-gradient(#07152d 0 23%,#163653 23% 37%,#187128 37% 100%)}.lights{position:absolute;top:0;width:100%;height:28%;background:radial-gradient(ellipse at 8% 7%,#fff 0 1%,#dbe9ff 2%,transparent 9%),radial-gradient(ellipse at 92% 7%,#fff 0 1%,#dbe9ff 2%,transparent 9%),linear-gradient(#061127,#132a48)}.crowd{position:absolute;top:18%;height:24%;width:100%;background:radial-gradient(circle,#f4cf35 0 2px,transparent 3px) 0 0/19px 17px,radial-gradient(circle,#35a852 0 2px,transparent 3px) 7px 8px/17px 19px,#17263d}.board{position:absolute;top:37%;height:5%;width:100%;background:#073e82;border-block:2px solid #4e87c8;text-align:center;font-weight:950;letter-spacing:3px;padding:7px;font-size:12px}.field{position:absolute;top:42%;bottom:0;width:100%;background:linear-gradient(90deg,#237b2e,#2c9137 15%,#237b2e 30%,#2c9137 45%,#237b2e 60%,#2c9137 75%,#237b2e);clip-path:polygon(9% 0,91% 0,100% 100%,0 100%)}.goal{position:absolute;z-index:6;top:31%;left:10%;width:80%;height:27%;border:7px solid #f4f6fa;border-bottom-width:5px;box-shadow:0 0 12px #fff8,inset 0 0 20px #0004;background:repeating-linear-gradient(90deg,#fff3 0 1px,transparent 1px 18px),repeating-linear-gradient(0deg,#fff3 0 1px,transparent 1px 18px)}.score{position:absolute;z-index:35;top:max(10px,env(safe-area-inset-top));left:8px;right:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.pill{background:linear-gradient(#13243cdd,#07111fef);border:1px solid #ffffff38;border-radius:13px;padding:6px 2px;text-align:center;font-size:10px;font-weight:800}.pill b{display:block;font-size:20px}.keeper{position:absolute;z-index:9;top:44%;left:50%;transform:translate(-50%,-50%);font-size:72px;filter:drop-shadow(0 5px 4px #0009);transition:left .3s,top .3s}.player{position:absolute;z-index:14;left:25%;top:72%;font-size:90px;transform:translate(-50%,-50%) scaleX(-1);filter:drop-shadow(0 7px 4px #0008);transform-origin:bottom center}.player.kick{animation:kick .45s ease-in-out}@keyframes kick{45%{transform:translate(-50%,-50%) scaleX(-1) rotate(-20deg)}75%{transform:translate(-50%,-50%) scaleX(-1) rotate(15deg)}}.ball{position:absolute;z-index:16;left:50%;top:77%;transform:translate(-50%,-50%);font-size:56px;filter:drop-shadow(0 5px 4px #0009);transition:left .42s cubic-bezier(.2,.8,.2,1),top .42s cubic-bezier(.2,.8,.2,1),transform .42s}.controls{position:absolute;z-index:30;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.arrow{height:58px;border:1px solid #ffffff55;border-radius:16px;background:linear-gradient(#173557e8,#07172ce8);color:#fff;font-size:28px;font-weight:950;box-shadow:0 5px 15px #0008}.arrow:active{transform:scale(.94);background:#1d65a5}.hint{position:absolute;z-index:28;bottom:145px;width:100%;text-align:center;font-size:13px;font-weight:850;text-shadow:0 2px 5px #000}.msg{position:absolute;z-index:45;top:20%;width:100%;text-align:center;font-size:42px;font-weight:950;text-shadow:0 4px 10px #000}.overlay{position:absolute;z-index:60;inset:0;background:#020a18e8;display:grid;place-items:center;padding:24px}.card{text-align:center;background:linear-gradient(#142b49,#071527);border:1px solid #ffffff35;border-radius:26px;padding:27px;width:100%;max-width:380px}.card h1{font-size:36px;margin:5px}.card p{color:#cbd9e9;line-height:1.45}.main{border:0;border-radius:17px;padding:17px;width:100%;font-size:19px;font-weight:950;background:#ffd431;color:#102038}.hidden{display:none}</style></head><body><main class="game"><div class="lights"></div><div class="crowd"></div><div class="board">⚽ CHUTE A GOL　⚽ CHUTE A GOL</div><div class="field"></div><div class="score"><div class="pill">⏱ TEMPO<b id="time">60</b></div><div class="pill">⚽ GOLS<b id="goals">0</b></div><div class="pill">🔥 SEQUÊNCIA<b id="streak">0</b></div><div class="pill">🏆 RECORDE<b id="best">0</b></div></div><div class="goal"></div><div class="keeper" id="keeper">🧍‍♂️</div><div class="player" id="player">🏃‍♂️</div><div class="ball" id="ball">⚽</div><div class="msg" id="msg"></div><div class="hint">Escolha uma flecha para chutar ⚽</div><div class="controls"><button class="arrow" onclick="kick('TL')">↖️</button><button class="arrow" onclick="kick('TC')">⬆️</button><button class="arrow" onclick="kick('TR')">↗️</button><button class="arrow" onclick="kick('BL')">↙️</button><button class="arrow" onclick="kick('C')">⬆️</button><button class="arrow" onclick="kick('BR')">↘️</button></div><div class="overlay" id="start"><div class="card"><div style="font-size:70px">⚽🥅</div><h1>CHUTE A GOL</h1><p>Agora é simples: <b>toque em uma das flechas</b> para escolher onde o jogador vai chutar.</p><button class="main" onclick="startGame()">JOGAR</button></div></div></main><script>const $=x=>document.getElementById(x),ball=$('ball'),player=$('player'),keeper=$('keeper');let goals=0,streak=0,time=60,timer,busy=false,best=+(localStorage.getItem('chute-best')||0);$('best').textContent=best;const pos={TL:[24,36],TC:[50,35],TR:[76,36],BL:[25,51],C:[50,49],BR:[75,51]};function startGame(){$('start').classList.add('hidden');goals=streak=0;time=60;busy=false;upd();clearInterval(timer);timer=setInterval(()=>{time--;$('time').textContent=time;if(time<=0){clearInterval(timer);busy=true;$('msg').textContent='TEMPO! ⚽';setTimeout(()=>{$('start').classList.remove('hidden');$('start').querySelector('p').innerHTML='Você marcou <b>'+goals+' gols</b>. Toque abaixo para jogar novamente.';$('start').querySelector('button').textContent='JOGAR NOVAMENTE';$('msg').textContent=''},800)}},1000)}function upd(){$('goals').textContent=goals;$('streak').textContent=streak;$('best').textContent=best;$('time').textContent=time}function kick(dir){if(busy||time<=0)return;busy=true;let keys=Object.keys(pos),save=keys[Math.floor(Math.random()*keys.length)],p=pos[dir],s=pos[save];player.classList.remove('kick');void player.offsetWidth;player.classList.add('kick');keeper.style.left=s[0]+'%';keeper.style.top=s[1]+'%';setTimeout(()=>{ball.style.left=p[0]+'%';ball.style.top=p[1]+'%';ball.style.transform='translate(-50%,-50%) scale(.55) rotate(300deg)'},130);setTimeout(()=>{let goal=dir!==save;if(goal){goals++;streak++;$('msg').textContent='GOOOL! ⚽'}else{streak=0;$('msg').textContent='DEFENDEU! 🧤'}if(goals>best){best=goals;localStorage.setItem('chute-best',best)}upd();if(navigator.vibrate)navigator.vibrate(goal?35:[25,35,25])},480);setTimeout(reset,950)}function reset(){ball.style.transition='none';ball.style.left='50%';ball.style.top='77%';ball.style.transform='translate(-50%,-50%)';keeper.style.left='50%';keeper.style.top='44%';player.classList.remove('kick');$('msg').textContent='';void ball.offsetWidth;ball.style.transition='left .42s cubic-bezier(.2,.8,.2,1),top .42s cubic-bezier(.2,.8,.2,1),transform .42s';busy=false}</script></body></html>
