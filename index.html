<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><title>Chute a Gol</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none}body{margin:0;background:#020813;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}.game{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:linear-gradient(#07152d 0 23%,#163653 23% 37%,#187128 37% 100%)}.lights{position:absolute;top:0;width:100%;height:28%;background:radial-gradient(ellipse at 8% 7%,#fff 0 1%,#dbe9ff 2%,transparent 9%),radial-gradient(ellipse at 92% 7%,#fff 0 1%,#dbe9ff 2%,transparent 9%),linear-gradient(#061127,#132a48)}.crowd{position:absolute;top:18%;height:24%;width:100%;background:radial-gradient(circle,#f4cf35 0 2px,transparent 3px) 0 0/19px 17px,radial-gradient(circle,#35a852 0 2px,transparent 3px) 7px 8px/17px 19px,#17263d;opacity:.95}.board{position:absolute;top:37%;height:5%;width:100%;background:#073e82;border-block:2px solid #4e87c8;text-align:center;font-weight:950;letter-spacing:3px;padding:7px;font-size:12px}.field{position:absolute;top:42%;bottom:0;width:100%;background:linear-gradient(90deg,#237b2e,#2c9137 15%,#237b2e 30%,#2c9137 45%,#237b2e 60%,#2c9137 75%,#237b2e);transform-origin:top;clip-path:polygon(9% 0,91% 0,100% 100%,0 100%)}.goal{position:absolute;z-index:6;top:31%;left:10%;width:80%;height:27%;border:7px solid #f4f6fa;border-bottom-width:5px;box-shadow:0 0 12px #fff8,inset 0 0 20px #0004;background:repeating-linear-gradient(90deg,#fff3 0 1px,transparent 1px 18px),repeating-linear-gradient(0deg,#fff3 0 1px,transparent 1px 18px)}.score{position:absolute;z-index:35;top:max(10px,env(safe-area-inset-top));left:8px;right:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.pill{background:linear-gradient(#13243cdd,#07111fef);border:1px solid #ffffff38;border-radius:13px;padding:6px 2px;text-align:center;font-size:10px;font-weight:800}.pill b{display:block;font-size:20px}.keeper{position:absolute;z-index:9;top:44%;left:50%;transform:translate(-50%,-50%);font-size:72px;filter:drop-shadow(0 5px 4px #0009);transition:left .3s,top .3s}.player{position:absolute;z-index:14;left:25%;top:76%;font-size:92px;transform:translate(-50%,-50%) scaleX(-1);filter:drop-shadow(0 7px 4px #0008);transform-origin:bottom center}.player.kick{animation:kick .45s ease-in-out}@keyframes kick{45%{transform:translate(-50%,-50%) scaleX(-1) rotate(-20deg)}75%{transform:translate(-50%,-50%) scaleX(-1) rotate(15deg)}}.ball{position:absolute;z-index:16;left:50%;top:81%;transform:translate(-50%,-50%);font-size:58px;filter:drop-shadow(0 5px 4px #0009);pointer-events:none}.hint{position:absolute;z-index:28;bottom:3%;left:10%;width:80%;padding:10px;border-radius:14px;background:#06140bc9;text-align:center;font-size:13px;font-weight:800}.msg{position:absolute;z-index:45;top:20%;width:100%;text-align:center;font-size:42px;font-weight:950;text-shadow:0 4px 10px #000}canvas{position:absolute;z-index:22;inset:0;width:100%;height:100%;touch-action:none}.overlay{position:absolute;z-index:60;inset:0;background:#020a18e8;display:grid;place-items:center;padding:24px}.card{text-align:center;background:linear-gradient(#142b49,#071527);border:1px solid #ffffff35;border-radius:26px;padding:27px;width:100%;max-width:380px;box-shadow:0 20px 70px #000}.card h1{font-size:36px;margin:5px}.card p{color:#cbd9e9;line-height:1.45}.main{border:0;border-radius:17px;padding:17px;width:100%;font-size:19px;font-weight:950;background:#ffd431;color:#102038}.hidden{display:none}</style></head><body><main class="game" id="game"><div class="lights"></div><div class="crowd"></div><div class="board">⚽ CHUTE A GOL　⚽ CHUTE A GOL</div><div class="field"></div><div class="score"><div class="pill">⏱ TEMPO<b id="time">60</b></div><div class="pill">⚽ GOLS<b id="goals">0</b></div><div class="pill">🔥 SEQUÊNCIA<b id="streak">0</b></div><div class="pill">🏆 RECORDE<b id="best">0</b></div></div><div class="goal"></div><div class="keeper" id="keeper">🧍‍♂️</div><div class="player" id="player">🏃‍♂️</div><canvas id="trail"></canvas><div class="ball" id="ball">⚽</div><div class="msg" id="msg"></div><div class="hint">☝️ Trace uma linha com o dedo direcionando o chute</div><div class="overlay" id="start"><div class="card"><div style="font-size:70px">🏟️⚽</div><h1>CHUTE A GOL</h1><p>Você tem <b>60 segundos</b>. Desenhe a trajetória com o dedo, o jogador chuta e o goleiro tenta defender.</p><button class="main" onclick="startGame()">JOGAR</button></div></div></main><script>const $=x=>document.getElementById(x),game=$('game'),ball=$('ball'),player=$('player'),keeper=$('keeper'),cv=$('trail'),ctx=cv.getContext('2d');let goals=0,streak=0,busy=false,draw=false,pts=[],time=60,timer,best=+(localStorage.getItem('chute-best')||0);$('best').textContent=best;function size(){let r=game.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}size();addEventListener('resize',size);function startGame(){$('start').classList.add('hidden');goals=streak=0;time=60;upd();clearInterval(timer);timer=setInterval(()=>{time--;$('time').textContent=time;if(time<=0){clearInterval(timer);$('msg').textContent='TEMPO! ⚽';busy=true;setTimeout(()=>{$('start').classList.remove('hidden');$('start').querySelector('p').innerHTML='Você marcou <b>'+goals+' gols</b>. Quer tentar superar seu recorde?';$('start').querySelector('button').textContent='JOGAR NOVAMENTE'},900)}},1000)}function upd(){$('goals').textContent=goals;$('streak').textContent=streak;$('best').textContent=best;$('time').textContent=time}function point(e){let r=game.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}cv.onpointerdown=e=>{if(busy||time<=0)return;let p=point(e),w=game.clientWidth,h=game.clientHeight,bx=w*.5,by=h*.81;if(Math.hypot(p.x-bx,p.y-by)>85)return;draw=true;pts=[{x:bx,y:by},p];cv.setPointerCapture(e.pointerId);paint()};cv.onpointermove=e=>{if(!draw)return;let p=point(e);if(Math.hypot(p.x-pts.at(-1).x,p.y-pts.at(-1).y)>4){pts.push(p);paint()}};cv.onpointerup=()=>{if(!draw)return;draw=false;if(pts.length>3&&pts.at(-1).y<game.clientHeight*.62)shoot();else clearTrail()};function paint(){ctx.clearRect(0,0,cv.width,cv.height);ctx.shadowBlur=15;ctx.shadowColor='#27a9ff';ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let p of pts)ctx.lineTo(p.x,p.y);ctx.strokeStyle='#d8f7ff';ctx.lineWidth=6;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();ctx.shadowBlur=0}function clearTrail(){ctx.clearRect(0,0,cv.width,cv.height);pts=[]}function shoot(){busy=true;player.classList.remove('kick');void player.offsetWidth;player.classList.add('kick');let end=pts.at(-1),w=game.clientWidth,h=game.clientHeight,gx=w*.10,gy=h*.31,gw=w*.80,gh=h*.27,kx=gx+35+Math.random()*(gw-70),ky=gy+40+Math.random()*(gh-65),inside=end.x>gx&&end.x<gx+gw&&end.y>gy&&end.y<gy+gh,saved=inside&&Math.hypot(end.x-kx,end.y-ky)<68;keeper.style.left=kx/w*100+'%';keeper.style.top=ky/h*100+'%';setTimeout(()=>{let i=0;function a(){if(i>=pts.length){result(inside&&!saved);return}let p=pts[i];ball.style.left=p.x+'px';ball.style.top=p.y+'px';ball.style.transform='translate(-50%,-50%) scale('+(1-.5*i/pts.length)+') rotate('+(i*25)+'deg)';i+=Math.max(1,Math.floor(pts.length/26));requestAnimationFrame(a)}a()},170)}function result(goal){setTimeout(()=>{if(goal){goals++;streak++;$('msg').textContent='GOOOL! ⚽'}else{streak=0;$('msg').textContent='DEFENDEU! 🧤'}if(goals>best){best=goals;localStorage.setItem('chute-best',best)}upd();if(navigator.vibrate)navigator.vibrate(goal?35:[25,35,25]);setTimeout(reset,650)},100)}function reset(){clearTrail();ball.style.left='50%';ball.style.top='81%';ball.style.transform='translate(-50%,-50%)';keeper.style.left='50%';keeper.style.top='44%';player.classList.remove('kick');$('msg').textContent='';busy=false}</script></body></html>
