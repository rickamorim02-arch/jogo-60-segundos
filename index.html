<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><title>Arco e Flecha</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none}body{margin:0;background:#07140d;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}.game{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:linear-gradient(#62b8df 0 37%,#6a9e43 37% 100%)}.mountains{position:absolute;top:22%;width:100%;height:25%;background:#436b45;clip-path:polygon(0 70%,12% 25%,24% 68%,39% 15%,55% 70%,72% 30%,87% 65%,100% 20%,100% 100%,0 100%)}.ground{position:absolute;top:39%;bottom:0;width:100%;background:linear-gradient(#6e9d42,#375e2c)}.range{position:absolute;top:42%;left:50%;width:4px;height:36%;background:#fff5;transform:translateX(-50%)}.score{position:absolute;z-index:30;top:max(10px,env(safe-area-inset-top));left:8px;right:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.pill{background:linear-gradient(#182b20e8,#07130dec);border:1px solid #ffffff40;border-radius:13px;padding:6px 2px;text-align:center;font-size:9px;font-weight:850}.pill b{display:block;font-size:20px}.target{position:absolute;z-index:8;left:50%;top:34%;width:180px;height:180px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#f3cf22 0 12%,#e83232 12% 25%,#2684d5 25% 40%,#111 40% 55%,#eee 55% 70%,#b7864e 70%);border:7px solid #79512d;box-shadow:0 8px 18px #0008}.target:after{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;left:50%;top:50%;transform:translate(-50%,-50%)}.stand{position:absolute;z-index:6;left:50%;top:42%;width:12px;height:26%;background:#704822;transform:translateX(-50%)}.archer{position:absolute;z-index:14;left:22%;top:72%;font-size:94px;filter:drop-shadow(0 7px 5px #0008)}.bow{position:absolute;z-index:15;left:46%;top:70%;font-size:72px;transform:translate(-50%,-50%) rotate(-35deg);filter:drop-shadow(0 5px 4px #0008)}.shot{position:absolute;z-index:18;left:48%;top:69%;font-size:50px;transform:translate(-50%,-50%) rotate(-40deg);opacity:0;transition:left .38s ease-out,top .38s ease-out,transform .38s}.controls{position:absolute;z-index:30;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.arrowbtn{height:58px;border:1px solid #ffffff55;border-radius:16px;background:linear-gradient(#253c2de8,#0d1d13ef);color:#fff;font-size:28px;font-weight:950;box-shadow:0 5px 15px #0008}.arrowbtn:active{transform:scale(.94);background:#467b4f}.hint{position:absolute;z-index:25;bottom:145px;width:100%;text-align:center;font-size:13px;font-weight:850;text-shadow:0 2px 5px #000}.msg{position:absolute;z-index:45;top:16%;width:100%;text-align:center;font-size:39px;font-weight:950;text-shadow:0 4px 10px #000}.overlay{position:absolute;z-index:60;inset:0;background:#06120ce8;display:grid;place-items:center;padding:24px}.card{text-align:center;background:linear-gradient(#294431,#0c2114);border:1px solid #ffffff35;border-radius:26px;padding:27px;width:100%;max-width:380px}.card h1{font-size:34px;margin:5px}.card p{color:#d1dfd3;line-height:1.45}.main{border:0;border-radius:17px;padding:17px;width:100%;font-size:19px;font-weight:950;background:#efc638;color:#172315}.hidden{display:none}</style></head><body><main class="game"><div class="mountains"></div><div class="ground"></div><div class="range"></div><div class="score"><div class="pill">⏱ TEMPO<b id="time">60</b></div><div class="pill">🎯 PONTOS<b id="points">0</b></div><div class="pill">🔥 SEQUÊNCIA<b id="streak">0</b></div><div class="pill">🏆 RECORDE<b id="best">0</b></div></div><div class="stand"></div><div class="target" id="target"></div><div class="archer">🧍</div><div class="bow">🏹</div><div class="shot" id="shot">➶</div><div class="msg" id="msg"></div><div class="hint">Escolha uma direção e dispare 🏹</div><div class="controls"><button class="arrowbtn" onclick="fire('TL')">↖️</button><button class="arrowbtn" onclick="fire('TC')">⬆️</button><button class="arrowbtn" onclick="fire('TR')">↗️</button><button class="arrowbtn" onclick="fire('BL')">↙️</button><button class="arrowbtn" onclick="fire('C')">🎯</button><button class="arrowbtn" onclick="fire('BR')">↘️</button></div><div class="overlay" id="start"><div class="card"><div style="font-size:72px">🏹🎯</div><h1>ARCO E FLECHA</h1><p>Você tem <b>60 segundos</b>. Escolha a direção do disparo. Quanto mais perto do centro do alvo, mais pontos.</p><button class="main" onclick="startGame()">COMEÇAR</button></div></div></main><script>const $=x=>document.getElementById(x),shot=$('shot'),target=$('target');let points=0,streak=0,time=60,timer,busy=false,best=+(localStorage.getItem('archery-best')||0);$('best').textContent=best;const pos={TL:[43,29],TC:[50,27],TR:[57,29],BL:[44,38],C:[50,34],BR:[56,38]};const score={TL:6,TC:7,TR:6,BL:5,C:10,BR:5};function startGame(){$('start').classList.add('hidden');points=streak=0;time=60;busy=false;upd();clearInterval(timer);timer=setInterval(()=>{time--;$('time').textContent=time;if(time<=0){clearInterval(timer);busy=true;$('msg').textContent='TEMPO! 🏹';setTimeout(()=>{$('start').classList.remove('hidden');$('start').querySelector('p').innerHTML='Você fez <b>'+points+' pontos</b>. Tente superar seu recorde!';$('start').querySelector('button').textContent='JOGAR NOVAMENTE';$('msg').textContent=''},800)}},1000)}function upd(){$('points').textContent=points;$('streak').textContent=streak;$('best').textContent=best;$('time').textContent=time}function fire(dir){if(busy||time<=0)return;busy=true;let p=pos[dir],jitter=(Math.random()-.5)*5,x=p[0]+jitter,y=p[1]+jitter*.5,base=score[dir],earned=Math.max(1,Math.round(base-Math.abs(jitter)));shot.style.transition='none';shot.style.left='48%';shot.style.top='69%';shot.style.opacity='1';shot.style.transform='translate(-50%,-50%) rotate(-40deg) scale(1.3)';void shot.offsetWidth;shot.style.transition='left .38s ease-out,top .38s ease-out,transform .38s';shot.style.left=x+'%';shot.style.top=y+'%';shot.style.transform='translate(-50%,-50%) rotate(-88deg) scale(.65)';setTimeout(()=>{points+=earned;streak++;$('msg').textContent=earned>=9?'🎯 NA MOSCA! +'+earned:earned>=6?'ÓTIMO! +'+earned:'+'+earned+' PONTOS';if(points>best){best=points;localStorage.setItem('archery-best',best)}upd();if(navigator.vibrate)navigator.vibrate(earned>=9?[30,25,30]:25)},390);setTimeout(()=>{$('msg').textContent='';shot.style.opacity='0';busy=false},850)}</script></body></html>
