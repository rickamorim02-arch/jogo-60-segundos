<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><title>Arco e Flecha Viking</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#07140d;color:#fff;font-family:system-ui,sans-serif}.game{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:linear-gradient(#62b8df 0 34%,#6a9e43 34%)}.mountains{position:absolute;top:18%;width:100%;height:22%;background:#436b45;clip-path:polygon(0 70%,12% 25%,24% 68%,39% 15%,55% 70%,72% 30%,87% 65%,100% 20%,100% 100%,0 100%)}.ground{position:absolute;top:34%;bottom:0;width:100%;background:linear-gradient(#719f45,#345b2b)}.score{position:absolute;z-index:40;top:max(10px,env(safe-area-inset-top));left:8px;right:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;pointer-events:none}.pill{background:#0a1d11e8;border:1px solid #ffffff40;border-radius:13px;padding:6px 2px;text-align:center;font-size:9px;font-weight:850}.pill b{display:block;font-size:20px}.target{position:absolute;z-index:8;left:50%;top:27%;width:128px;height:128px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#f3cf22 0 11%,#e83232 11% 24%,#2684d5 24% 39%,#111 39% 54%,#eee 54% 70%,#b7864e 70%);border:5px solid #79512d;box-shadow:0 6px 13px #0008}.stand{position:absolute;z-index:6;left:50%;top:32%;width:8px;height:22%;background:#704822;transform:translateX(-50%)}.viking{position:absolute;z-index:14;left:19%;top:70%;width:112px;height:170px;transform:translate(-50%,-50%);filter:drop-shadow(0 7px 5px #0008);pointer-events:none}.v-head{position:absolute;left:35px;top:17px;width:53px;height:58px;border-radius:45% 45% 48% 48%;background:#e2ad7b;border:3px solid #5b3425}.v-helmet{position:absolute;left:29px;top:5px;width:65px;height:35px;border-radius:38px 38px 8px 8px;background:linear-gradient(#7d8790,#414951);border:3px solid #272c30}.v-helmet:after{content:'';position:absolute;left:29px;top:-8px;width:6px;height:48px;background:#aab0b4}.v-hair{position:absolute;left:28px;top:42px;width:68px;height:48px;border-radius:15px 15px 28px 28px;background:#7a4424}.v-face{position:absolute;left:41px;top:36px;width:42px;height:34px;border-radius:40%;background:#e5b07d;z-index:2}.v-beard{position:absolute;left:39px;top:57px;width:47px;height:50px;background:#9a572c;clip-path:polygon(0 0,100% 0,80% 72%,50% 100%,18% 72%);z-index:3}.v-body{position:absolute;left:25px;top:91px;width:72px;height:63px;border-radius:17px 17px 7px 7px;background:linear-gradient(90deg,#57372a,#8b6040,#57372a);border:3px solid #34251f}.v-body:after{content:'';position:absolute;left:0;right:0;top:29px;height:9px;background:#30231d;border-block:2px solid #b28a4e}.v-leg1,.v-leg2{position:absolute;top:145px;width:19px;height:34px;background:#3c332d;border-radius:7px}.v-leg1{left:34px;transform:rotate(5deg)}.v-leg2{left:70px;transform:rotate(-6deg)}.v-arm{position:absolute;left:78px;top:91px;width:50px;height:17px;border-radius:12px;background:#e2ad7b;transform:rotate(-18deg);transform-origin:left center}.bow{position:absolute;z-index:16;left:45%;top:71%;font-size:76px;transform:translate(-50%,-50%) rotate(-35deg);filter:drop-shadow(0 5px 4px #0008);pointer-events:none;will-change:transform}.aim{position:absolute;z-index:22;width:40px;height:40px;border:2px solid #fff;border-radius:50%;transform:translate3d(-50%,-50%,0);display:none;pointer-events:none;box-shadow:0 0 0 2px #0005,0 0 15px #fff8}.aim:before,.aim:after{content:'';position:absolute;background:#fff}.aim:before{width:56px;height:2px;left:-10px;top:17px}.aim:after{height:56px;width:2px;left:17px;top:-10px}.power{position:absolute;z-index:24;left:12%;right:12%;bottom:7%;height:12px;border-radius:10px;background:#0008;border:1px solid #fff5;overflow:hidden;display:none}.power>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f4d63a,#e33b2f)}.hint{position:absolute;z-index:25;bottom:11%;width:100%;text-align:center;font-size:13px;font-weight:900;text-shadow:0 2px 5px #000}.msg{position:absolute;z-index:45;top:13%;width:100%;text-align:center;font-size:36px;font-weight:950;text-shadow:0 4px 10px #000;pointer-events:none}canvas{position:absolute;z-index:20;inset:0;width:100%;height:100%;touch-action:none}.overlay{position:absolute;z-index:60;inset:0;background:#06120ce8;display:grid;place-items:center;padding:24px}.card{text-align:center;background:linear-gradient(#294431,#0c2114);border:1px solid #ffffff35;border-radius:26px;padding:27px;width:100%;max-width:380px}.card h1{font-size:34px;margin:5px}.card p{color:#d1dfd3;line-height:1.45}.main{border:0;border-radius:17px;padding:17px;width:100%;font-size:19px;font-weight:950;background:#efc638;color:#172315}.hidden{display:none}</style></head><body><main class="game" id="game"><div class="mountains"></div><div class="ground"></div><div class="score"><div class="pill">⏱ TEMPO<b id="time">60</b></div><div class="pill">🎯 PONTOS<b id="points">0</b></div><div class="pill">🔥 SEQUÊNCIA<b id="streak">0</b></div><div class="pill">🏆 RECORDE<b id="best">0</b></div></div><div class="stand"></div><div class="target" id="target"></div><div class="viking"><div class="v-hair"></div><div class="v-head"></div><div class="v-helmet"></div><div class="v-face"></div><div class="v-beard"></div><div class="v-body"></div><div class="v-arm"></div><div class="v-leg1"></div><div class="v-leg2"></div></div><div class="bow" id="bow">🏹</div><canvas id="canvas"></canvas><div class="aim" id="aim"></div><div class="power" id="power"><i id="powerFill"></i></div><div class="msg" id="msg"></div><div class="hint">☝️ Deslize para mirar — parou, dispara</div><div class="overlay" id="start"><div class="card"><div style="font-size:72px">🛡️🏹🎯</div><h1>ARCO E FLECHA VIKING</h1><p>Controle o arqueiro viking. Mova a mira e pare o dedo para disparar automaticamente.</p><button class="main" onclick="startGame()">COMEÇAR</button></div></div></main><script>const $=x=>document.getElementById(x),game=$('game'),cv=$('canvas'),ctx=cv.getContext('2d'),aim=$('aim'),bow=$('bow'),pf=$('powerFill');let points=0,streak=0,time=60,timer,busy=false,drag=false,startP=null,power=.7,autoTimer=0,rafAim=0,pending=null,stuck=[],best=+(localStorage.getItem('archery-best')||0);$('best').textContent=best;function resize(){let r=game.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);drawStuck()}resize();addEventListener('resize',resize,{passive:true});function pnt(e){let r=game.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function startGame(){$('start').classList.add('hidden');points=streak=0;time=60;busy=false;stuck=[];drawStuck();upd();clearInterval(timer);timer=setInterval(()=>{time--;$('time').textContent=time;if(time<=0)finish()},1000)}function finish(){clearInterval(timer);clearTimeout(autoTimer);busy=true;drag=false;$('msg').textContent='TEMPO! 🏹';setTimeout(()=>{$('start').classList.remove('hidden');$('start').querySelector('p').innerHTML='Você fez <b>'+points+' pontos</b>. Tente superar seu recorde!';$('start').querySelector('button').textContent='JOGAR NOVAMENTE';$('msg').textContent=''},700)}function upd(){$('points').textContent=points;$('streak').textContent=streak;$('best').textContent=best;$('time').textContent=time}cv.addEventListener('pointerdown',e=>{if(busy||time<=0)return;let p=pnt(e);if(p.y<game.clientHeight*.46)return;drag=true;startP=p;power=.7;cv.setPointerCapture(e.pointerId);aim.style.display='block';$('power').style.display='block';pf.style.width='70%';pending=p;scheduleAim();armAuto()});cv.addEventListener('pointermove',e=>{if(!drag)return;pending=pnt(e);scheduleAim();armAuto()});cv.addEventListener('pointerup',()=>{if(!drag)return;clearTimeout(autoTimer);release()});cv.addEventListener('pointercancel',()=>{clearTimeout(autoTimer);drag=false;resetAim()});function armAuto(){clearTimeout(autoTimer);autoTimer=setTimeout(()=>{if(drag)release()},190)}function scheduleAim(){if(rafAim)return;rafAim=requestAnimationFrame(()=>{rafAim=0;if(!pending||!drag)return;let dx=pending.x-startP.x,dy=pending.y-startP.y,dist=Math.min(240,Math.hypot(dx,dy));power=Math.max(.62,dist/240);pf.style.width=(power*100)+'%';let tx=game.clientWidth*.5+dx*.78,ty=game.clientHeight*.27+dy*.78;tx=Math.max(25,Math.min(game.clientWidth-25,tx));ty=Math.max(game.clientHeight*.12,Math.min(game.clientHeight*.46,ty));aim.style.left=tx+'px';aim.style.top=ty+'px';let ang=Math.atan2(ty-game.clientHeight*.71,tx-game.clientWidth*.45)*180/Math.PI;bow.style.transform='translate3d(-50%,-50%,0) rotate('+(ang+5)+'deg)'})}function resetAim(){aim.style.display='none';$('power').style.display='none';pf.style.width='0';bow.style.transform='translate3d(-50%,-50%,0) rotate(-35deg)';power=.7;pending=null}function release(){if(!drag||busy)return;drag=false;clearTimeout(autoTimer);let ar=aim.getBoundingClientRect(),gr=game.getBoundingClientRect(),tx=ar.left-gr.left+ar.width/2,ty=ar.top-gr.top+ar.height/2,pow=power;busy=true;resetAim();fire(tx,ty,pow)}function drawArrow(x,y,ang,scale=1){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(scale,scale);ctx.strokeStyle='#4a2b15';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-24,0);ctx.lineTo(17,0);ctx.stroke();ctx.fillStyle='#e8e8e8';ctx.beginPath();ctx.moveTo(23,0);ctx.lineTo(14,-5);ctx.lineTo(14,5);ctx.closePath();ctx.fill();ctx.fillStyle='#d84a3e';ctx.beginPath();ctx.moveTo(-24,0);ctx.lineTo(-33,-6);ctx.lineTo(-30,0);ctx.lineTo(-33,6);ctx.closePath();ctx.fill();ctx.restore()}function drawStuck(){ctx.clearRect(0,0,game.clientWidth,game.clientHeight);for(let a of stuck){let s=.72,tip=23*s,embed=4;drawArrow(a.x-(tip-embed)*Math.cos(a.ang),a.y-(tip-embed)*Math.sin(a.ang),a.ang,s)}}function fire(tx,ty,pow){let sx=game.clientWidth*.46,sy=game.clientHeight*.68,duration=520-Math.min(.95,pow)*190,start=performance.now(),lastX=sx,lastY=sy,ang=-1.3;function frame(now){let t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,3),x=sx+(tx-sx)*ease,y=sy+(ty-sy)*ease-42*Math.sin(Math.PI*t)*(1-pow);ang=Math.atan2(y-lastY,x-lastX);lastX=x;lastY=y;drawStuck();drawArrow(x,y,ang,1-t*.3);if(t<1)requestAnimationFrame(frame);else hit(tx,ty,ang)}requestAnimationFrame(frame)}function hit(x,y,ang){let tr=$('target').getBoundingClientRect(),gr=game.getBoundingClientRect(),cx=tr.left-gr.left+tr.width/2,cy=tr.top-gr.top+tr.height/2,r=tr.width/2,d=Math.hypot(x-cx,y-cy),earned=d<r*.12?10:d<r*.25?8:d<r*.4?6:d<r*.55?4:d<r*.72?2:0;if(earned){let impactAng=Math.atan2(y-game.clientHeight*.68,x-game.clientWidth*.46);stuck.push({x,y,ang:impactAng});if(stuck.length>18)stuck.shift();points+=earned;streak++;$('msg').textContent=earned===10?'🎯 NA MOSCA! +10':'+'+earned+' PONTOS';if(navigator.vibrate)navigator.vibrate(earned===10?[22,18,22]:16)}else{streak=0;$('msg').textContent='ERROU!'}drawStuck();if(points>best){best=points;localStorage.setItem('archery-best',best)}upd();setTimeout(()=>{$('msg').textContent='';busy=false},430)}</script></body></html>
