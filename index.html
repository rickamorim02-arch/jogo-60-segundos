<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><title>Chute a Gol</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none}body{margin:0;background:#071b30;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}.game{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:#43a43c}.sky{position:absolute;inset:0 0 65%;background:linear-gradient(#1385d1,#9be0ff)}.field{position:absolute;top:35%;bottom:0;width:100%;background:repeating-linear-gradient(0deg,#399436 0 55px,#43a43c 55px 110px)}.goal{position:absolute;z-index:5;top:28%;left:9%;width:82%;height:31%;border:8px solid #eee;border-bottom-width:5px;background:repeating-linear-gradient(45deg,#fff3 0 2px,transparent 2px 18px),repeating-linear-gradient(-45deg,#fff3 0 2px,transparent 2px 18px)}.score{position:absolute;z-index:30;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between}.pill{background:#071b30dd;padding:9px 13px;border-radius:16px;font-weight:900}.title{position:absolute;z-index:3;top:68px;width:100%;text-align:center;font-weight:950;font-size:24px;text-shadow:0 2px 5px #0008}.keeper{position:absolute;z-index:8;top:43%;left:50%;transform:translate(-50%,-50%);font-size:72px;transition:left .35s,top .35s}.player{position:absolute;z-index:14;left:25%;top:75%;font-size:82px;transform:translate(-50%,-50%) scaleX(-1);transform-origin:bottom center;pointer-events:none}.player.kick{animation:kick .42s ease-in-out}@keyframes kick{0%{transform:translate(-50%,-50%) scaleX(-1) rotate(0)}45%{transform:translate(-50%,-50%) scaleX(-1) rotate(-18deg) translateY(-4px)}75%{transform:translate(-50%,-50%) scaleX(-1) rotate(13deg)}100%{transform:translate(-50%,-50%) scaleX(-1) rotate(0)}}.ball{position:absolute;z-index:15;left:50%;top:80%;transform:translate(-50%,-50%);font-size:60px;pointer-events:none}.hint{position:absolute;z-index:25;bottom:5%;width:100%;text-align:center;font-weight:900;text-shadow:0 2px 4px #000}.msg{position:absolute;z-index:40;top:18%;width:100%;text-align:center;font-size:39px;font-weight:950;text-shadow:0 3px 8px #000;pointer-events:none}canvas{position:absolute;z-index:20;inset:0;width:100%;height:100%;touch-action:none}.overlay{position:absolute;z-index:60;inset:0;background:#061529e8;display:grid;place-items:center;padding:25px}.card{text-align:center;background:#102845;border-radius:28px;padding:28px;width:100%;max-width:380px}.card h1{font-size:36px;margin:5px}.card p{color:#c9d8ea;line-height:1.45}.main{border:0;border-radius:18px;padding:17px;width:100%;font-size:19px;font-weight:950;background:#ffcb36;color:#172033}.hidden{display:none}</style></head><body><main class="game" id="game"><div class="sky"></div><div class="field"></div><div class="score"><div class="pill">⚽ <span id="goals">0</span></div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">🏆 <span id="best">0</span></div></div><div class="title">CHUTE A GOL</div><div class="goal"></div><div class="keeper" id="keeper">🧤</div><div class="player" id="player">🏃</div><canvas id="trail"></canvas><div class="ball" id="ball">⚽</div><div class="msg" id="msg"></div><div class="hint">Trace com o dedo a direção do chute ☝️⚽</div><div class="overlay" id="start"><div class="card"><div style="font-size:70px">🏃⚽🥅</div><h1>CHUTE A GOL</h1><p>O jogador vai bater na bola. <b>Trace o caminho do chute com o dedo</b> e, ao soltar, ele chuta na direção desenhada.</p><button class="main" onclick="startGame()">COMEÇAR</button></div></div></main><script>const $=x=>document.getElementById(x),game=$('game'),ball=$('ball'),player=$('player'),keeper=$('keeper'),cv=$('trail'),ctx=cv.getContext('2d');let goals=0,streak=0,busy=false,draw=false,pts=[],best=+(localStorage.getItem('chute-best')||0);$('best').textContent=best;function size(){let r=game.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}size();addEventListener('resize',size);function startGame(){$('start').classList.add('hidden');goals=streak=0;upd()}function upd(){$('goals').textContent=goals;$('streak').textContent=streak;$('best').textContent=best}function point(e){let r=game.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}cv.onpointerdown=e=>{if(busy)return;let p=point(e),r=game.getBoundingClientRect(),bx=r.width*.5,by=r.height*.8;if(Math.hypot(p.x-bx,p.y-by)>80)return;draw=true;pts=[{x:bx,y:by},p];cv.setPointerCapture(e.pointerId);paint()};cv.onpointermove=e=>{if(!draw)return;let p=point(e);if(Math.hypot(p.x-pts.at(-1).x,p.y-pts.at(-1).y)>5){pts.push(p);paint()}};cv.onpointerup=()=>{if(!draw)return;draw=false;if(pts.length>3&&pts.at(-1).y<game.clientHeight*.62)shoot();else clearTrail()};function paint(){ctx.clearRect(0,0,cv.width,cv.height);ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let p of pts)ctx.lineTo(p.x,p.y);ctx.strokeStyle='#ffe14d';ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}function clearTrail(){ctx.clearRect(0,0,cv.width,cv.height);pts=[]}function shoot(){busy=true;player.classList.remove('kick');void player.offsetWidth;player.classList.add('kick');let end=pts.at(-1),w=game.clientWidth,h=game.clientHeight,gx=w*.09,gy=h*.28,gw=w*.82,gh=h*.31,kx=gx+35+Math.random()*(gw-70),ky=gy+45+Math.random()*(gh-75);let inside=end.x>gx&&end.x<gx+gw&&end.y>gy&&end.y<gy+gh,saved=inside&&Math.hypot(end.x-kx,end.y-ky)<70;keeper.style.left=kx/w*100+'%';keeper.style.top=ky/h*100+'%';setTimeout(()=>{let i=0;function anim(){if(i>=pts.length){result(inside&&!saved);return}let p=pts[i];ball.style.left=p.x+'px';ball.style.top=p.y+'px';ball.style.transform='translate(-50%,-50%) scale('+(1-.45*i/pts.length)+') rotate('+(i*22)+'deg)';i+=Math.max(1,Math.floor(pts.length/24));requestAnimationFrame(anim)}anim()},180)}function result(goal){setTimeout(()=>{if(goal){goals++;streak++;$('msg').textContent='GOOOL! ⚽'}else{streak=0;$('msg').textContent='DEFENDEU! 🧤'}if(goals>best){best=goals;localStorage.setItem('chute-best',best)}upd();if(navigator.vibrate)navigator.vibrate(goal?35:[30,40,30]);setTimeout(reset,700)},120)}function reset(){clearTrail();ball.style.left='50%';ball.style.top='80%';ball.style.transform='translate(-50%,-50%)';keeper.style.left='50%';keeper.style.top='43%';player.classList.remove('kick');$('msg').textContent='';busy=false}</script></body></html>
