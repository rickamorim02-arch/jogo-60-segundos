<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>60 Segundos</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0c1020;color:#fff;min-height:100dvh;display:grid;place-items:center}.app{width:min(100%,480px);min-height:100dvh;padding:22px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;gap:10px}.pill{background:#171d35;border:1px solid #293252;border-radius:18px;padding:10px 14px;font-weight:800}.brand{text-align:center;margin:28px 0 8px;font-size:clamp(34px,10vw,52px);font-weight:950;letter-spacing:-2px}.sub{text-align:center;color:#aab4d3;margin:0 auto 26px;max-width:340px}.card{background:linear-gradient(145deg,#171d35,#10152a);border:1px solid #293252;border-radius:28px;padding:24px;box-shadow:0 18px 55px #0007;flex:1;display:flex;flex-direction:column;justify-content:center}.big{font-size:64px;text-align:center;margin:8px 0}.prompt{text-align:center;font-size:24px;font-weight:850;min-height:68px;display:grid;place-items:center}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}button{border:0;border-radius:18px;padding:17px;font-size:18px;font-weight:900;background:#7c5cff;color:#fff;touch-action:manipulation}.answers button{background:#232b4a}.answers button:active,.main:active{transform:scale(.98)}.main{width:100%;margin-top:18px;background:#7c5cff}.hidden{display:none!important}.center{text-align:center}.score{font-size:72px;font-weight:950;margin:8px}.muted{color:#aab4d3}.combo{text-align:center;color:#ffd66b;font-weight:900;height:24px}.footer{text-align:center;color:#737f9f;font-size:12px;padding-top:16px}
</style></head>
<body><main class="app">
<div class="top"><div class="pill">⏱️ <span id="time">60</span>s</div><div class="pill">⭐ <span id="points">0</span></div><div class="pill">🏆 <span id="record">0</span></div></div>
<h1 class="brand">60 SEGUNDOS</h1><p class="sub" id="subtitle">Desafios rápidos para desligar a cabeça por um minuto.</p>
<section class="card" id="start"><div class="big">⚡</div><h2 class="center">Pronto para o desafio?</h2><p class="center muted">Lógica, cálculo, memória e atenção. Acerte o máximo possível antes do tempo acabar.</p><button class="main" onclick="startGame()">JOGAR 60 SEGUNDOS</button></section>
<section class="card hidden" id="game"><div class="combo" id="combo"></div><div class="big" id="icon">🧠</div><div class="prompt" id="prompt"></div><div class="answers" id="answers"></div></section>
<section class="card hidden" id="end"><div class="big">🏁</div><h2 class="center">Tempo!</h2><div class="score center" id="final">0</div><p class="center muted" id="resultText"></p><button class="main" onclick="startGame()">JOGAR NOVAMENTE</button></section>
<div class="footer">Seu recorde fica salvo neste aparelho.</div></main>
<script>
let score=0,combo=0,time=60,timer,answer=null,locked=false;
const $=id=>document.getElementById(id);let record=Number(localStorage.getItem('j60-record')||0);$('record').textContent=record;
function show(id){['start','game','end'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function startGame(){score=0;combo=0;time=60;locked=false;$('points').textContent=0;$('time').textContent=60;show('game');next();clearInterval(timer);timer=setInterval(()=>{time--;$('time').textContent=time;if(time<=0)finish()},1000)}
function finish(){clearInterval(timer);if(score>record){record=score;localStorage.setItem('j60-record',record);$('record').textContent=record}$('final').textContent=score+' pts';$('resultText').textContent=score>=300?'Excelente! Novo ritmo de campeão.':score>=150?'Muito bem! Tente superar seu recorde.':'Boa pausa! Mais uma rodada e você melhora.';show('end')}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}function shuffle(a){return a.sort(()=>Math.random()-.5)}
function next(){locked=false;let type=rnd(0,3),q,opts,icon;if(type===0){let a=rnd(2,20),b=rnd(2,20);answer=a+b;q=`Quanto é ${a} + ${b}?`;opts=[answer,answer+rnd(1,4),answer-rnd(1,4),answer+rnd(5,9)];icon='➕'}else if(type===1){let n=rnd(2,9),step=rnd(2,6);answer=n+step*3;q=`Complete: ${n}, ${n+step}, ${n+step*2}, ?`;opts=[answer,answer+step,answer-step,answer+1];icon='🔢'}else if(type===2){let words=['AZUL','VERDE','SOL','LUA','FOCO','TEMPO'];answer=words[rnd(0,words.length-1)];q=`Toque em: ${answer}`;opts=shuffle([answer,...shuffle(words.filter(x=>x!==answer)).slice(0,3)]);icon='🎯'}else{let a=rnd(3,12),b=rnd(2,9);answer=a*b;q=`${a} × ${b} = ?`;opts=[answer,answer+b,Math.max(1,answer-a),answer+rnd(1,5)];icon='⚡'}$('icon').textContent=icon;$('prompt').textContent=q;$('answers').innerHTML='';[...new Set(shuffle(opts))].slice(0,4).forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>choose(v,b);$('answers').appendChild(b)});$('combo').textContent=combo>=2?`🔥 Combo x${combo}`:''}
function choose(v,b){if(locked)return;locked=true;if(v===answer){combo++;let gain=10+Math.min(combo,10)*2;score+=gain;b.style.background='#258f68'}else{combo=0;b.style.background='#b9435b';[...$('answers').children].forEach(x=>{if(String(x.textContent)===String(answer))x.style.background='#258f68'})}$('points').textContent=score;setTimeout(next,260)}
</script></body></html>
