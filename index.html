<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><title>Arqueiro Viking</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08120e;color:white;font-family:system-ui,sans-serif;touch-action:none}.game{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:#111}.scene{position:absolute;inset:0;background:url('cenario-viking.png') center/cover no-repeat}.shade{position:absolute;inset:0;background:linear-gradient(#0007,transparent 25% 72%,#0008);pointer-events:none}.hud{position:absolute;z-index:20;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:7px}.box{flex:1;background:#07131be8;border:1px solid #ffffff35;border-radius:14px;text-align:center;padding:6px 3px;font-size:9px;font-weight:800}.box b{display:block;font-size:21px}.wind{position:absolute;z-index:20;top:76px;left:50%;transform:translateX(-50%);background:#07131bdc;border:1px solid #ffffff35;border-radius:18px;padding:8px 18px;font-size:12px;font-weight:800;white-space:nowrap}.target{position:absolute;z-index:7;width:104px;height:104px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#ffd52c 0 12%,#d92731 12% 27%,#2582bd 27% 43%,#181818 43% 58%,#eee 58% 73%,#8b5a32 73%);border:4px solid #5a361c;box-shadow:0 7px 15px #0008;transition:left .22s ease,top .22s ease}.cross{position:absolute;z-index:12;width:38px;height:38px;border:2px solid white;border-radius:50%;transform:translate(-50%,-50%);display:none;pointer-events:none;filter:drop-shadow(0 1px 2px #000)}.cross:before,.cross:after{content:'';position:absolute;background:white}.cross:before{width:54px;height:2px;left:-10px;top:16px}.cross:after{width:2px;height:54px;left:16px;top:-10px}.bow{position:absolute;z-index:8;left:-25px;bottom:13%;width:150px;height:290px;pointer-events:none}.bow:before{content:'';position:absolute;left:48px;top:10px;width:70px;height:260px;border-right:9px solid #6f401c;border-radius:0 100% 100% 0;transform:rotate(-5deg);box-shadow:3px 0 #b17a36}.bow:after{content:'';position:absolute;left:101px;top:20px;width:2px;height:245px;background:#e7d6b7;transform:rotate(-5deg);transform-origin:center}.hand{position:absolute;z-index:9;left:51px;bottom:23%;width:72px;height:30px;border-radius:30px;background:linear-gradient(90deg,#5a301b,#bb7951);transform:rotate(-5deg);pointer-events:none}.hint{position:absolute;z-index:20;bottom:max(18px,env(safe-area-inset-bottom));left:9%;right:9%;background:#07130de0;border:1px solid #ffffff35;border-radius:15px;text-align:center;padding:10px;font-size:12px;font-weight:850}.msg{position:absolute;z-index:25;top:19%;left:0;right:0;text-align:center;font-size:30px;font-weight:950;text-shadow:0 4px 8px #000}.overlay{position:absolute;z-index:40;inset:0;background:#06100be8;display:grid;place-items:center;padding:24px}.card{width:100%;max-width:370px;text-align:center;background:#102018ef;border:1px solid #ffffff35;border-radius:25px;padding:28px}.card h1{font-size:34px;margin:5px}.card p{font-size:16px;line-height:1.45}.btn{width:100%;border:0;border-radius:16px;background:#e5b83e;color:#172315;padding:16px;font-size:18px;font-weight:950}.hidden{display:none}canvas{position:absolute;z-index:10;inset:0;width:100%;height:100%;touch-action:none}</style></head><body><main class="game" id="game"><div class="scene"></div><div class="shade"></div><div class="hud"><div class="box">⏱ TEMPO<b id="time">30</b></div><div class="box">🎯 PONTOS<b id="score">0</b></div><div class="box">🔥 SEQUÊNCIA<b id="combo">0</b></div><div class="box">🏆 RECORDE<b id="best">0</b></div></div><div class="wind" id="wind">VENTO → 0</div><div class="target" id="target"></div><div class="bow"></div><div class="hand"></div><canvas id="cv"></canvas><div class="cross" id="cross"></div><div class="msg" id="msg"></div><div class="hint">Arraste para mirar • solte para disparar</div><div class="overlay" id="overlay"><div class="card"><div style="font-size:58px">🏹</div><h1>ARQUEIRO VIKING</h1><p id="intro">Um jogo pra todos e para ninguém.<br><br>Você tem 30 segundos. Mire, compense o vento e bata seu recorde.</p><button class="btn" id="play">JOGAR</button></div></div></main><script>const $=id=>document.getElementById(id),game=$('game'),cv=$('cv'),ctx=cv.getContext('2d'),target=$('target'),cross=$('cross');let running=false,busy=false,drag=false,time=30,score=0,combo=0,best=+(localStorage.getItem('viking-best')||0),timer=null,sx=0,sy=0,ax=0,ay=0,wind=0;$('best').textContent=best;function resize(){let r=game.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}resize();addEventListener('resize',resize);function targetCenter(){let a=target.getBoundingClientRect(),g=game.getBoundingClientRect();return{x:a.left-g.left+a.width/2,y:a.top-g.top+a.height/2,r:a.width/2}}function placeTarget(first=false){let w=game.clientWidth,h=game.clientHeight,x=first?w*.63:w*(.48+Math.random()*.34),y=first?h*.48:h*(.32+Math.random()*.32);target.style.left=x+'px';target.style.top=y+'px'}placeTarget(true);function newWind(){let mag=Math.floor(Math.random()*5),dir=Math.random()<.5?-1:1;wind=mag*dir;$('wind').textContent='VENTO '+(wind<0?'← ':wind>0?'→ ':'• ')+Math.abs(wind)+' km/h'}function hud(){$('time').textContent=time;$('score').textContent=score;$('combo').textContent=combo;$('best').textContent=best}function start(){running=true;busy=false;drag=false;time=30;score=0;combo=0;$('overlay').classList.add('hidden');$('msg').textContent='';cross.style.display='none';ctx.clearRect(0,0,game.clientWidth,game.clientHeight);placeTarget(true);newWind();hud();clearInterval(timer);timer=setInterval(()=>{time--;hud();if(time<=0)finish()},1000)}function finish(){running=false;busy=true;drag=false;clearInterval(timer);cross.style.display='none';$('msg').textContent='TEMPO!';setTimeout(()=>{$('msg').textContent='';$('intro').innerHTML='Você fez <b>'+score+' pontos</b>.<br>Recorde: <b>'+best+'</b>.<br><br>Mais uma?';$('play').textContent='JOGAR NOVAMENTE';$('overlay').classList.remove('hidden')},600)}$('play').onclick=start;function pos(e){let r=game.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}cv.onpointerdown=e=>{if(!running||busy)return;drag=true;let p=pos(e);sx=p.x;sy=p.y;let t=targetCenter();ax=t.x;ay=t.y;cross.style.display='block';cross.style.left=ax+'px';cross.style.top=ay+'px';cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!drag)return;let p=pos(e),dx=p.x-sx,dy=p.y-sy;ax=Math.max(24,Math.min(game.clientWidth-24,targetCenter().x+dx*.85));ay=Math.max(135,Math.min(game.clientHeight-75,targetCenter().y+dy*.85));cross.style.left=ax+'px';cross.style.top=ay+'px'};cv.onpointerup=()=>{if(!drag||busy)return;drag=false;cross.style.display='none';shoot(ax,ay)};cv.onpointercancel=()=>{drag=false;cross.style.display='none'};function origin(){return{x:82,y:game.clientHeight*.66}}function arrow(x,y,a,s=1){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.scale(s,s);ctx.lineCap='round';ctx.strokeStyle='#7b481f';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-30,0);ctx.lineTo(24,0);ctx.stroke();ctx.strokeStyle='#d7a63b';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-25,-1);ctx.lineTo(20,-1);ctx.stroke();ctx.fillStyle='#d7a63b';ctx.beginPath();ctx.moveTo(33,0);ctx.lineTo(20,-6);ctx.lineTo(23,0);ctx.lineTo(20,6);ctx.closePath();ctx.fill();ctx.fillStyle='#9b2d25';ctx.beginPath();ctx.moveTo(-27,0);ctx.lineTo(-39,-7);ctx.lineTo(-35,0);ctx.lineTo(-39,7);ctx.closePath();ctx.fill();ctx.restore()}function shoot(tx,ty){busy=true;let o=origin(),endX=tx+wind*5.5,endY=ty,start=performance.now(),dur=430;function tick(now){let p=Math.min(1,(now-start)/dur),e=1-Math.pow(1-p,3),x=o.x+(endX-o.x)*e,y=o.y+(endY-o.y)*e-45*Math.sin(Math.PI*e),dx=endX-o.x,dy=(endY-o.y)-45*Math.PI*Math.cos(Math.PI*e),a=Math.atan2(dy,dx);ctx.clearRect(0,0,game.clientWidth,game.clientHeight);arrow(x,y,a,.9-.15*e);if(p<1)requestAnimationFrame(tick);else{ctx.clearRect(0,0,game.clientWidth,game.clientHeight);scoreShot(endX,endY)}}requestAnimationFrame(tick)}function scoreShot(x,y){let t=targetCenter(),d=Math.hypot(x-t.x,y-t.y),r=t.r,pts=d<r*.14?10:d<r*.3?8:d<r*.47?6:d<r*.64?4:d<r*.82?2:0;if(pts){combo++;let bonus=combo>=3?Math.min(5,combo-2):0,got=pts+bonus;score+=got;$('msg').textContent=pts===10?'🎯 NA MOSCA! +'+got:'+'+got}else{combo=0;$('msg').textContent='ERROU'}if(score>best){best=score;localStorage.setItem('viking-best',best)}hud();setTimeout(()=>{$('msg').textContent='';if(running){placeTarget(false);newWind();busy=false}},280)}</script></body></html>
