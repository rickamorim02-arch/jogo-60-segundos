<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><title>Arco e Flecha Viking</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#07100d;color:#fff;font-family:system-ui,sans-serif}.game{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:#101914 url('cenario-viking.png') center center/cover no-repeat}.shade{position:absolute;inset:0;background:linear-gradient(#0007 0 12%,transparent 25% 72%,#0008 100%);pointer-events:none}.score{position:absolute;z-index:50;top:max(8px,env(safe-area-inset-top));left:7px;right:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.pill{background:#07131be6;border:1px solid #ffffff45;border-radius:12px;padding:5px 2px;text-align:center;font-size:8px;font-weight:850;backdrop-filter:blur(6px);box-shadow:0 4px 12px #0008}.pill b{display:block;font-size:18px}.wind{position:absolute;z-index:45;top:70px;left:50%;transform:translateX(-50%);min-width:225px;text-align:center;background:#0b1821df;border:1px solid #ffffff50;border-radius:16px;padding:7px 12px;font-weight:900;font-size:11px;backdrop-filter:blur(7px);box-shadow:0 5px 15px #0008}.wind span{font-size:19px}.wind small{display:block;color:#d7e9f2;font-size:8px}.target{position:absolute;z-index:12;left:72%;top:31%;width:78px;height:78px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#f4d12a 0 11%,#d92f35 11% 25%,#2776b8 25% 40%,#171717 40% 55%,#eee 55% 70%,#9b6b3e 70%);border:3px solid #5b3a1e;box-shadow:0 4px 12px #000a}.aim{position:absolute;z-index:30;width:34px;height:34px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);display:none;pointer-events:none;box-shadow:0 0 12px #fff}.aim:before,.aim:after{content:'';position:absolute;background:#fff}.aim:before{width:48px;height:1px;left:-9px;top:14px}.aim:after{height:48px;width:1px;left:14px;top:-9px}.msg{position:absolute;z-index:55;top:14%;width:100%;text-align:center;font-size:32px;font-weight:950;text-shadow:0 4px 10px #000;pointer-events:none}.hint{position:absolute;z-index:35;bottom:max(18px,env(safe-area-inset-bottom));left:8%;right:8%;padding:9px;border-radius:13px;text-align:center;font-size:12px;font-weight:900;background:#07120dc2;border:1px solid #ffffff30;backdrop-filter:blur(5px)}canvas{position:absolute;z-index:22;inset:0;width:100%;height:100%;touch-action:none}.overlay{position:absolute;z-index:70;inset:0;background:#06100bd9;display:grid;place-items:center;padding:24px;backdrop-filter:blur(3px)}.card{text-align:center;background:#102018e8;border:1px solid #ffffff38;border-radius:25px;padding:25px;width:100%;max-width:380px;box-shadow:0 20px 60px #000}.card h1{font-size:30px;margin:5px}.card p{color:#dbe4dd;line-height:1.45}.main{border:0;border-radius:16px;padding:16px;width:100%;font-size:18px;font-weight:950;background:#e8bd43;color:#172315}.hidden{display:none}</style></head><body><main class="game" id="game"><div class="shade"></div><div class="score"><div class="pill">⏱ TEMPO<b id="time">60</b></div><div class="pill">🎯 PONTOS<b id="points">0</b></div><div class="pill">🔥 SEQUÊNCIA<b id="streak">0</b></div><div class="pill">🏆 RECORDE<b id="best">0</b></div></div><div class="wind">VENTO <span id="ha">→</span> <b id="hv">0</b>　<span id="va">↑</span> <b id="vv">0</b><small>horizontal　•　vertical</small></div><div class="target" id="target"></div><canvas id="canvas"></canvas><div class="aim" id="aim"></div><div class="msg" id="msg"></div><div class="hint">☝️ Deslize para mirar • pare para disparar • compense o vento ↔ ↕</div><div class="overlay" id="start"><div class="card"><div style="font-size:62px">🏹🎯</div><h1>ARCO E FLECHA VIKING</h1><p>O <b>cenário renderizado agora é o próprio gráfico do jogo</b>. Mire e compense o vento horizontal e vertical.</p><button class="main" onclick="startGame()">COMEÇAR</button></div></div></main><script>const $=x=>document.getElementById(x),game=$('game'),cv=$('canvas'),ctx=cv.getContext('2d'),aim=$('aim');let points=0,streak=0,time=60,timer,busy=false,drag=false,startP,pending,autoTimer,raf=0,marks=[],windH=0,windV=0,best=+(localStorage.getItem('archery-best')||0);$('best').textContent=best;function resize(){let r=game.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);drawMarks()}resize();addEventListener('resize',resize,{passive:true});function pt(e){let r=game.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function wind(){windH=Math.round(Math.random()*12-6);windV=Math.round(Math.random()*8-4);$('hv').textContent=Math.abs(windH)+' km/h';$('vv').textContent=Math.abs(windV)+' km/h';$('ha').textContent=windH<0?'←':windH>0?'→':'•';$('va').textContent=windV<0?'↑':windV>0?'↓':'•'}function upd(){$('points').textContent=points;$('streak').textContent=streak;$('best').textContent=best;$('time').textContent=time}function startGame(){$('start').classList.add('hidden');points=streak=0;time=60;busy=false;marks=[];wind();upd();drawMarks();clearInterval(timer);timer=setInterval(()=>{time--;$('time').textContent=time;if(time<=0)finish()},1000)}function finish(){clearInterval(timer);clearTimeout(autoTimer);busy=true;drag=false;$('msg').textContent='TEMPO! 🏹';setTimeout(()=>{$('start').classList.remove('hidden');$('start').querySelector('p').innerHTML='Você fez <b>'+points+' pontos</b>. Tente superar seu recorde.';$('start').querySelector('button').textContent='JOGAR NOVAMENTE';$('msg').textContent=''},650)}cv.onpointerdown=e=>{if(busy||time<=0)return;let p=pt(e);if(p.y<game.clientHeight*.42)return;drag=true;startP=p;pending=p;cv.setPointerCapture(e.pointerId);aim.style.display='block';schedule();arm()};cv.onpointermove=e=>{if(!drag)return;pending=pt(e);schedule();arm()};cv.onpointerup=()=>{if(drag){clearTimeout(autoTimer);release()}};cv.onpointercancel=()=>{drag=false;clearTimeout(autoTimer);aim.style.display='none'};function arm(){clearTimeout(autoTimer);autoTimer=setTimeout(()=>{if(drag)release()},190)}function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;if(!drag)return;let dx=pending.x-startP.x,dy=pending.y-startP.y,tx=game.clientWidth*.72+dx*.72,ty=game.clientHeight*.31+dy*.72;tx=Math.max(18,Math.min(game.clientWidth-18,tx));ty=Math.max(game.clientHeight*.13,Math.min(game.clientHeight*.58,ty));aim.style.left=tx+'px';aim.style.top=ty+'px'})}function release(){if(!drag||busy)return;drag=false;busy=true;clearTimeout(autoTimer);let a=aim.getBoundingClientRect(),g=game.getBoundingClientRect(),tx=a.left-g.left+a.width/2,ty=a.top-g.top+a.height/2;aim.style.display='none';fire(tx,ty)}function arrow(x,y,ang,s=1){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(s,s);ctx.strokeStyle='#3a2515';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-30,0);ctx.lineTo(20,0);ctx.stroke();ctx.fillStyle='#dce2e5';ctx.beginPath();ctx.moveTo(29,0);ctx.lineTo(17,-5);ctx.lineTo(17,5);ctx.closePath();ctx.fill();ctx.fillStyle='#b72f2f';ctx.beginPath();ctx.moveTo(-30,0);ctx.lineTo(-42,-7);ctx.lineTo(-37,0);ctx.lineTo(-42,7);ctx.closePath();ctx.fill();ctx.restore()}function drawMarks(){ctx.clearRect(0,0,game.clientWidth,game.clientHeight);for(const m of marks){ctx.beginPath();ctx.arc(m.x,m.y,3.5,0,Math.PI*2);ctx.fillStyle='#ff3b30';ctx.fill();ctx.lineWidth=1.4;ctx.strokeStyle='#fff';ctx.stroke()}}function fire(tx,ty){let sx=game.clientWidth*.27,sy=game.clientHeight*.62,start=performance.now(),dur=650,lastX=sx,lastY=sy,h=windH*3.1,v=windV*3;function frame(now){let t=Math.min(1,(now-start)/dur),e=1-Math.pow(1-t,2.8),x=sx+(tx-sx)*e+h*t*t,y=sy+(ty-sy)*e-45*Math.sin(Math.PI*t)+v*t*t,ang=Math.atan2(y-lastY,x-lastX);lastX=x;lastY=y;drawMarks();arrow(x,y,ang,1-t*.45);if(t<1)requestAnimationFrame(frame);else hit(x,y)}requestAnimationFrame(frame)}function hit(x,y){let tr=$('target').getBoundingClientRect(),gr=game.getBoundingClientRect(),cx=tr.left-gr.left+tr.width/2,cy=tr.top-gr.top+tr.height/2,r=tr.width/2,d=Math.hypot(x-cx,y-cy),earned=d<r*.12?10:d<r*.25?8:d<r*.4?6:d<r*.55?4:d<r*.72?2:0;if(earned){marks.push({x,y});if(marks.length>20)marks.shift();points+=earned;streak++;$('msg').textContent=earned===10?'🎯 NA MOSCA! +10':'+'+earned+' PONTOS';if(navigator.vibrate)navigator.vibrate(earned===10?[20,15,20]:14)}else{streak=0;$('msg').textContent='ERROU!'}if(points>best){best=points;localStorage.setItem('archery-best',best)}drawMarks();upd();setTimeout(()=>{$('msg').textContent='';wind();busy=false},480)}</script></body></html>
