<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chute a Gol</title><style>*{box-sizing:border-box;user-select:none}body{margin:0;background:#071b30;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}.game{height:100dvh;max-width:520px;margin:auto;position:relative;background:linear-gradient(#1671b9 0 35%,#46a53c 35% 100%);overflow:hidden}.sky{position:absolute;inset:0 0 65% 0;background:linear-gradient(#1385d1,#8bd5ff)}.cloud{position:absolute;font-size:45px;opacity:.8}.score{position:absolute;z-index:20;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between}.pill{background:#071b30dd;padding:9px 13px;border-radius:16px;font-weight:900}.title{position:absolute;z-index:3;top:70px;width:100%;text-align:center;font-weight:950;font-size:24px;text-shadow:0 2px 5px #0008}.field{position:absolute;top:35%;bottom:0;width:100%;background:repeating-linear-gradient(0deg,#399436 0 55px,#43a43c 55px 110px)}.line{position:absolute;border:3px solid #fff9;left:8%;right:8%;top:28%;height:55%;border-bottom:0}.goal{position:absolute;z-index:5;top:29%;left:10%;width:80%;height:31%;border:8px solid #eee;border-bottom-width:5px;box-shadow:inset 0 0 0 2px #999;background:repeating-linear-gradient(45deg,#ffffff22 0 2px,transparent 2px 18px),repeating-linear-gradient(-45deg,#ffffff22 0 2px,transparent 2px 18px)}.keeper{position:absolute;z-index:8;top:43%;left:50%;transform:translate(-50%,-50%);font-size:72px;transition:left .35s cubic-bezier(.2,.8,.2,1),top .35s}.ball{position:absolute;z-index:12;left:50%;top:78%;transform:translate(-50%,-50%);font-size:58px;transition:left .42s cubic-bezier(.2,.8,.2,1),top .42s cubic-bezier(.2,.8,.2,1),transform .42s}.hint{position:absolute;z-index:20;bottom:18%;width:100%;text-align:center;font-weight:900;text-shadow:0 2px 4px #000}.controls{position:absolute;z-index:30;bottom:max(15px,env(safe-area-inset-bottom));left:12px;right:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.kick{border:0;background:#071b30dd;color:#fff;border-radius:18px;height:58px;font-size:25px;font-weight:900}.kick:active{transform:scale(.95)}.overlay{position:absolute;z-index:50;inset:0;background:#061529e8;display:grid;place-items:center;padding:25px}.card{text-align:center;background:#102845;border:1px solid #ffffff25;border-radius:28px;padding:28px;width:100%;max-width:380px}.card h1{font-size:36px;margin:5px}.card p{color:#c9d8ea}.main{border:0;border-radius:18px;padding:17px;width:100%;font-size:19px;font-weight:950;background:#ffcb36;color:#172033;margin-top:10px}.hidden{display:none}.msg{position:absolute;z-index:40;top:20%;width:100%;text-align:center;font-size:40px;font-weight:950;text-shadow:0 3px 8px #000;pointer-events:none}</style></head><body><main class="game"><div class="sky"><span class="cloud" style="left:8%;top:20%">☁️</span><span class="cloud" style="right:7%;top:8%">☁️</span></div><div class="field"><div class="line"></div></div><div class="score"><div class="pill">⚽ <span id="goals">0</span></div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">🏆 <span id="best">0</span></div></div><div class="title">CHUTE A GOL</div><div class="goal"></div><div class="keeper" id="keeper">🧤</div><div class="ball" id="ball">⚽</div><div class="msg" id="msg"></div><div class="hint" id="hint">Escolha um canto e CHUTE!</div><div class="controls"><button class="kick" onclick="kick('L')">↖️</button><button class="kick" onclick="kick('C')">⬆️</button><button class="kick" onclick="kick('R')">↗️</button><button class="kick" onclick="kick('BL')">↙️</button><button class="kick" onclick="kick('BC')">⬆️</button><button class="kick" onclick="kick('BR')">↘️</button></div><div class="overlay" id="start"><div class="card"><div style="font-size:70px">⚽🥅</div><h1>CHUTE A GOL</h1><p>Sem contas. Sem perguntas. Só escolha um canto e tente vencer o goleiro.</p><button class="main" onclick="start()">COMEÇAR</button></div></div></main><script>let goals=0,streak=0,busy=false,best=Number(localStorage.getItem('chute-best')||0);const $=x=>document.getElementById(x);$('best').textContent=best;const pos={L:[23,37],C:[50,36],R:[77,37],BL:[24,51],BC:[50,51],BR:[76,51]};function start(){$('start').classList.add('hidden');goals=0;streak=0;update()}function update(){$('goals').textContent=goals;$('streak').textContent=streak;$('best').textContent=best}function kick(dir){if(busy)return;busy=true;let choices=Object.keys(pos),save=choices[Math.floor(Math.random()*choices.length)],p=pos[dir],s=pos[save];$('keeper').style.left=s[0]+'%';$('keeper').style.top=s[1]+'%';$('ball').style.left=p[0]+'%';$('ball').style.top=p[1]+'%';$('ball').style.transform='translate(-50%,-50%) scale(.62) rotate(260deg)';let goal=dir!==save;setTimeout(()=>{if(goal){goals++;streak++;$('msg').textContent='GOOOL! ⚽';if(streak%5===0)$('msg').textContent='🔥 '+streak+' SEGUIDOS!'}else{streak=0;$('msg').textContent='DEFENDEU! 🧤'}if(goals>best){best=goals;localStorage.setItem('chute-best',best)}update();if(navigator.vibrate)navigator.vibrate(goal?35:[30,40,30])},360);setTimeout(()=>{$('ball').style.transition='none';$('ball').style.left='50%';$('ball').style.top='78%';$('ball').style.transform='translate(-50%,-50%)';$('keeper').style.transition='none';$('keeper').style.left='50%';$('keeper').style.top='43%';$('msg').textContent='';void $('ball').offsetWidth;$('ball').style.transition='left .42s cubic-bezier(.2,.8,.2,1),top .42s cubic-bezier(.2,.8,.2,1),transform .42s';$('keeper').style.transition='left .35s cubic-bezier(.2,.8,.2,1),top .35s';busy=false},1050)}</script></body></html>
