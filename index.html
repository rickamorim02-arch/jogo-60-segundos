<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><title>Arqueiro Viking</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#07100d;color:#fff;font-family:system-ui,sans-serif}.game{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:#101914}.scene{position:absolute;inset:-1%;background:url('cenario-viking.png') center/cover no-repeat;animation:world 7s ease-in-out infinite}.archerWrap{position:absolute;z-index:18;left:0;bottom:8%;width:48%;height:46%;overflow:hidden;pointer-events:none;filter:drop-shadow(4px 7px 8px #0008)}.archer{position:absolute;left:0;bottom:0;width:100%;height:100%;background-image:url('arqueiro-animado.png');background-repeat:no-repeat;transform-origin:38% 100%}.archer.bob{animation:bob 2.6s ease-in-out infinite}@keyframes world{0%,100%{transform:scale(1.015)}50%{transform:scale(1.022) translate(-1px,1px)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(1.5px)}}.shade{position:absolute;z-index:11;inset:0;background:linear-gradient(#0005 0 11%,transparent 23% 76%,#0006 100%);pointer-events:none}.score{position:absolute;z-index:50;top:max(8px,env(safe-area-inset-top));left:7px;right:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.pill{background:#07131be6;border:1px solid #ffffff45;border-radius:12px;padding:5px 2px;text-align:center;font-size:8px;font-weight:850}.pill b{display:block;font-size:18px}.wind{position:absolute;z-index:45;top:70px;left:50%;transform:translateX(-50%);min-width:205px;text-align:center;background:#0b1821df;border:1px solid #ffffff50;border-radius:16px;padding:7px 12px;font-weight:900;font-size:11px}.wind span{font-size:21px}.wind small{display:block;color:#d7e9f2;font-size:9px}.target{position:absolute;z-index:12;left:70%;top:50%;width:70px;height:70px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#f4d12a 0 11%,#d92f35 11% 25%,#2776b8 25% 40%,#171717 40% 55%,#eee 55% 70%,#9b6b3e 70%);border:3px solid #5b3a1e;box-shadow:0 5px 12px #0008}.aim{position:absolute;z-index:30;width:34px;height:34px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);display:none;pointer-events:none}.aim:before,.aim:after{content:'';position:absolute;background:#fff}.aim:before{width:48px;height:1px;left:-9px;top:14px}.aim:after{height:48px;width:1px;left:14px;top:-9px}.msg{position:absolute;z-index:55;top:15%;width:100%;text-align:center;font-size:30px;font-weight:950;text-shadow:0 4px 10px #000}.hint{position:absolute;z-index:35;bottom:max(18px,env(safe-area-inset-bottom));left:8%;right:8%;padding:9px;border-radius:13px;text-align:center;font-size:12px;font-weight:900;background:#07120dc2;border:1px solid #ffffff30}canvas{position:absolute;z-index:22;inset:0;width:100%;height:100%;touch-action:none}.overlay{position:absolute;z-index:70;inset:0;background:#06100bd9;display:grid;place-items:center;padding:24px}.card{text-align:center;background:#102018e8;border:1px solid #ffffff38;border-radius:25px;padding:25px;width:100%;max-width:380px}.card h1{font-size:34px;margin:5px}.card p{font-size:17px}.main{border:0;border-radius:16px;padding:16px;width:100%;font-size:18px;font-weight:950;background:#e8bd43;color:#172315}.hidden{display:none}</style></head><body><main class="game" id="game"><div class="scene"></div><div class="archerWrap" id="archerWrap"><div class="archer bob" id="archer"></div></div><div class="shade"></div><div class="score"><div class="pill">⏱ TEMPO<b id="time">60</b></div><div class="pill">🎯 PONTOS<b id="points">0</b></div><div class="pill">🔥 SEQUÊNCIA<b id="streak">0</b></div><div class="pill">🏆 RECORDE<b id="best">0</b></div></div><div class="wind">VENTO <span id="wa">→</span> <b id="wv">0 km/h</b><small id="wd">Direita</small></div><div class="target" id="target"></div><canvas id="canvas"></canvas><div class="aim" id="aim"></div><div class="msg" id="msg"></div><div class="hint">☝️ Deslize para mirar • compense o vento • pare para disparar</div><div class="overlay" id="start"><div class="card"><div style="font-size:62px">🏹🎯</div><h1>ARQUEIRO VIKING</h1><p>Um jogo pra todos e para ninguém.</p><button class="main" onclick="startGame()">COMEÇAR</button></div></div></main><script>const $=x=>document.getElementById(x),game=$('game'),archer=$('archer'),archerWrap=$('archerWrap'),cv=$('canvas'),ctx=cv.getContext('2d'),aim=$('aim');let points=0,streak=0,time=60,timer,busy=false,drag=false,startP,pending,autoTimer,raf=0,marks=[],windH=0,windV=0,aimX=0,aimY=0,animToken=0,best=+(localStorage.getItem('archery-best')||0);$('best').textContent=best;const SHEET_W=1536,SHEET_H=512;const seq={idle:{x:0,y:26,w:765,h:144,n:8},prepare:{x:770,y:26,w:766,h:144,n:8},aim:{x:0,y:198,w:905,h:146,n:8},release:{x:909,y:198,w:627,h:146,n:6},return:{x:0,y:371,w:625,h:141,n:6}};function frameRect(name,i){const s=seq[name],cw=s.w/s.n;return{x:s.x+cw*i,y:s.y,w:cw,h:s.h}}function framePos(name,i){const r=frameRect(name,i),box=archerWrap.getBoundingClientRect(),scale=box.height/r.h;archer.style.backgroundSize=(SHEET_W*scale)+'px '+(SHEET_H*scale)+'px';archer.style.backgroundPosition=(-r.x*scale)+'px '+(-r.y*scale)+'px';archer.style.width=(r.w*scale)+'px';archer.style.height=(r.h*scale)+'px';archer.style.left='0px';archer.style.bottom='0px'}function animate(name,ms,loop=false,done){let token=++animToken,s=seq[name],i=0;archer.classList.toggle('bob',name==='idle');function step(){if(token!==animToken)return;framePos(name,i);i++;if(i>=s.n){if(loop)i=0;else{done&&done();return}}setTimeout(step,ms)}step()}function idle(){animate('idle',150,true)}function resize(){let r=game.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2.5);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);redraw();framePos('idle',0)}resize();addEventListener('resize',resize,{passive:true});idle();function pt(e){let r=game.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function wind(){windH=0;windV=0;let horizontal=Math.random()<.5,mag=1+Math.floor(Math.random()*6),sign=Math.random()<.5?-1:1;if(horizontal){windH=mag*sign;$('wa').textContent=sign<0?'←':'→';$('wd').textContent=sign<0?'Esquerda':'Direita'}else{windV=mag*sign;$('wa').textContent=sign<0?'↑':'↓';$('wd').textContent=sign<0?'Para cima':'Para baixo'}$('wv').textContent=mag+' km/h'}function upd(){$('points').textContent=points;$('streak').textContent=streak;$('best').textContent=best;$('time').textContent=time}function startGame(){$('start').classList.add('hidden');points=streak=0;time=60;busy=false;marks=[];idle();wind();upd();redraw();clearInterval(timer);timer=setInterval(()=>{time--;$('time').textContent=time;if(time<=0)finish()},1000)}function finish(){clearInterval(timer);clearTimeout(autoTimer);busy=true;drag=false;idle();$('msg').textContent='TEMPO! 🏹';setTimeout(()=>{$('start').classList.remove('hidden');$('start').querySelector('p').innerHTML='Você fez <b>'+points+' pontos</b>. Tente superar seu recorde.';$('start').querySelector('button').textContent='JOGAR NOVAMENTE';$('msg').textContent=''},650)}cv.onpointerdown=e=>{if(busy||time<=0)return;let p=pt(e);if(p.y<game.clientHeight*.3)return;drag=true;startP=p;pending=p;animate('prepare',65,false,()=>{if(drag)animate('aim',85,true)});cv.setPointerCapture(e.pointerId);aim.style.display='block';schedule();arm()};cv.onpointermove=e=>{if(!drag)return;pending=pt(e);schedule();arm()};cv.onpointerup=()=>{if(drag){clearTimeout(autoTimer);releaseShot()}};cv.onpointercancel=()=>{drag=false;clearTimeout(autoTimer);aim.style.display='none';idle();redraw()};function arm(){clearTimeout(autoTimer);autoTimer=setTimeout(()=>{if(drag)releaseShot()},300)}function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;if(!drag)return;let dx=pending.x-startP.x,dy=pending.y-startP.y;aimX=game.clientWidth*.70+dx*.72;aimY=game.clientHeight*.50+dy*.72;aimX=Math.max(18,Math.min(game.clientWidth-18,aimX));aimY=Math.max(game.clientHeight*.16,Math.min(game.clientHeight*.75,aimY));aim.style.left=aimX+'px';aim.style.top=aimY+'px';redraw(true)})}function releaseShot(){if(!drag||busy)return;drag=false;busy=true;clearTimeout(autoTimer);let a=aim.getBoundingClientRect(),g=game.getBoundingClientRect(),tx=a.left-g.left+a.width/2,ty=a.top-g.top+a.height/2;aim.style.display='none';animate('release',58,false,()=>animate('return',72,false,idle));setTimeout(()=>fire(tx,ty),116)}function shotOrigin(){let r=archerWrap.getBoundingClientRect(),g=game.getBoundingClientRect();return{x:r.left-g.left+r.width*.78,y:r.top-g.top+r.height*.42}}function trajectory(tx,ty,t){let o=shotOrigin(),h=windH*3.1,v=windV*3;return{x:o.x+(tx-o.x)*t+h*t*t,y:o.y+(ty-o.y)*t-38*4*t*(1-t)+v*t*t}}function tangent(tx,ty,t){let o=shotOrigin(),h=windH*3.1,v=windV*3;return{x:(tx-o.x)+2*h*t,y:(ty-o.y)-152+304*t+2*v*t}}function drawPath(tx,ty){ctx.save();ctx.beginPath();for(let i=0;i<=72;i++){let p=trajectory(tx,ty,i/72);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.setLineDash([5,7]);ctx.lineWidth=1.7;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.stroke();ctx.restore()}function arrow(x,y,ang,s=1){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(s,s);ctx.lineCap='round';let wood=ctx.createLinearGradient(0,-2,0,2);wood.addColorStop(0,'#b47a3d');wood.addColorStop(.4,'#70421f');wood.addColorStop(1,'#3d2110');ctx.fillStyle=wood;ctx.beginPath();ctx.roundRect(-39,-1.5,62,3,1.5);ctx.fill();ctx.strokeStyle='#d8a83f';ctx.lineWidth=.8;for(let q=-27;q<14;q+=13){ctx.beginPath();ctx.moveTo(q,-1.4);ctx.lineTo(q+4,1.4);ctx.stroke()}ctx.fillStyle='#d7a52e';ctx.beginPath();ctx.moveTo(41,0);ctx.lineTo(25,-5);ctx.lineTo(28,-2);ctx.lineTo(22,0);ctx.lineTo(28,2);ctx.lineTo(25,5);ctx.closePath();ctx.fill();ctx.fillStyle='#8f241d';ctx.beginPath();ctx.moveTo(-36,-.7);ctx.quadraticCurveTo(-48,-5,-53,-4);ctx.lineTo(-46,0);ctx.quadraticCurveTo(-48,5,-53,4);ctx.lineTo(-36,1.3);ctx.closePath();ctx.fill();ctx.restore()}function arrowAtTip(x,y,ang,s){let tip=41*s;arrow(x-Math.cos(ang)*tip,y-Math.sin(ang)*tip,ang,s)}function drawMarks(){for(const m of marks)arrowAtTip(m.x,m.y,m.ang,.58)}function redraw(path=false){ctx.clearRect(0,0,game.clientWidth,game.clientHeight);drawMarks();if(path&&drag)drawPath(aimX,aimY)}function fire(tx,ty){let start=performance.now(),dur=900,lastAng=0;function frame(now){let raw=Math.min(1,(now-start)/dur),t=raw<.5?2*raw*raw:1-Math.pow(-2*raw+2,2)/2,p=trajectory(tx,ty,t),tan=tangent(tx,ty,t),ang=Math.atan2(tan.y,tan.x),s=.9-t*.25;lastAng=ang;redraw();drawPath(tx,ty);arrowAtTip(p.x,p.y,ang,s);if(raw<1)requestAnimationFrame(frame);else{redraw();hit(p.x,p.y,lastAng)}}requestAnimationFrame(frame)}function hit(x,y,ang){let tr=$('target').getBoundingClientRect(),gr=game.getBoundingClientRect(),cx=tr.left-gr.left+tr.width/2,cy=tr.top-gr.top+tr.height/2,r=tr.width/2,d=Math.hypot(x-cx,y-cy),earned=d<r*.12?10:d<r*.25?8:d<r*.4?6:d<r*.55?4:d<r*.72?2:0;if(earned){marks.push({x,y,ang});if(marks.length>8)marks.shift();points+=earned;streak++;$('msg').textContent=earned===10?'🎯 NA MOSCA! +10':'+'+earned+' PONTOS'}else{streak=0;$('msg').textContent='ERROU!'}if(points>best){best=points;localStorage.setItem('archery-best',best)}redraw();upd();setTimeout(()=>{$('msg').textContent='';wind();busy=false},480)}</script></body></html>
